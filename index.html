<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Surf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: WebGL scene full-bleed, a 2D canvas on top for glass HUD, two glossy pills bottom-right. Single bright Frutiger Aero look by design. */
:root {
  --sky: #3aa6ff;
  --navy: #0d3b66;
  --glass: rgba(255, 255, 255, 0.75);
  --glass-low: rgba(191, 230, 255, 0.62);
  --aqua: #1aa7ff;
  --font-ui: "Open Sans", "Segoe UI", Frutiger, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  background: var(--sky);
}
html, body { height: 100%; margin: 0; background: var(--sky); color: var(--navy); overflow: hidden; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--font-ui); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { pointer-events: none; }
#controls {
  position: fixed;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 8px;
}
.pill {
  font: 700 12px/1 var(--font-ui);
  color: var(--navy);
  background: linear-gradient(180deg, var(--glass) 0%, var(--glass) 48%, var(--glass-low) 52%, var(--glass-low) 100%);
  border: 1px solid #fff;
  border-radius: 999px;
  padding: 8px 14px;
  box-shadow: 0 2px 8px rgba(0, 50, 110, 0.25), inset 0 1px 0 #fff;
  cursor: pointer;
}
.pill:hover { filter: brightness(1.06); }
.pill:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
#fail {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
  text-align: center; font: 600 16px/1.5 var(--font-ui); color: var(--navy); background: var(--sky);
}
#fail[hidden] { display: none; }
#fail p { max-width: 34ch; background: var(--glass); border: 1px solid #fff; border-radius: 16px; padding: 18px 20px; margin: 0; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Aero Surf. Press space or tap to jump, hold in the air to backflip."></canvas>
<canvas id="ui"></canvas>
<div id="controls">
  <button id="model" class="pill" type="button">Load 3D model</button>
  <button id="mute" class="pill" type="button" aria-pressed="false">Sound on</button>
</div>
<input id="file" type="file" accept=".glb,.gltf,model/gltf-binary" hidden>
<div id="fail" hidden><p id="failmsg">Loading the 3D engine…</p></div>

<script>
// If the 3D engine never starts (offline, blocked CDN, no WebGL), say so instead of showing a blank sky.
setTimeout(() => {
  if (!window.__aeroBooted) {
    document.getElementById('fail').hidden = false;
    document.getElementById('failmsg').textContent = 'The 3D engine could not load. Check your internet connection and reload. This game needs a browser with WebGL.';
  }
}, 12000);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm';

/* ───────────────────────── utilities ───────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const smooth = t => t * t * (3 - 2 * t);
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [255, 255, 255];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

/* ───────────────────────── palettes ───────────────────────── */
const PAL_DEF = [
  { name: 'Lagoon', root: 146.8, night: 0, sunY: 0.32, skyTop: '#0b5fd8', skyHor: '#c6eeff', sun: '#fff6e0', deep: '#0a6cc0', shallow: '#2ff0dc', foam: '#ffffff', island: '#4cc95a', accent: '#1aa7ff', bubble: '#9fe9ff' },
  { name: 'Deep Blue', root: 130.8, night: 0, sunY: 0.42, skyTop: '#0a3fb8', skyHor: '#a8dcff', sun: '#ffffff', deep: '#062e78', shallow: '#1fb0ff', foam: '#ffffff', island: '#39b06b', accent: '#2a7dff', bubble: '#a9d4ff' },
  { name: 'Sunset Gloss', root: 164.8, night: 0, sunY: 0.1, skyTop: '#3a3fd1', skyHor: '#ffc59a', sun: '#ffd9a8', deep: '#33287e', shallow: '#ff8fb8', foam: '#fff0f6', island: '#a066d6', accent: '#ff4f9a', bubble: '#ffd0ec' },
  { name: 'Aurora', root: 110.0, night: 1, sunY: 0.3, skyTop: '#020b2e', skyHor: '#1f5fb1', sun: '#bff6ff', deep: '#021a40', shallow: '#19e6c0', foam: '#c9fff4', island: '#135e5a', accent: '#19d99a', bubble: '#7dfff0' },
  { name: 'Citrus', root: 174.6, night: 0, sunY: 0.48, skyTop: '#0a7ad6', skyHor: '#eeffd2', sun: '#fffbe8', deep: '#0a6aae', shallow: '#7fffd0', foam: '#ffffff', island: '#8fd400', accent: '#62b800', bubble: '#e8ff9a' },
];
const CKEYS = ['skyTop', 'skyHor', 'sun', 'deep', 'shallow', 'foam', 'island', 'accent', 'bubble'];
const PALS = PAL_DEF.map(p => { const o = { name: p.name, root: p.root, night: p.night, sunY: p.sunY }; CKEYS.forEach(k => o[k] = hex(p[k])); return o; });
const pal = { name: 'Lagoon', root: 146.8, night: 0, sunY: 0.32, zone: 0, key: '' };
CKEYS.forEach(k => pal[k] = PALS[0][k].slice());

/* ───────────────────────── renderer & scene ───────────────────────── */
const glc = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fail').hidden = false;
  document.getElementById('failmsg').textContent = 'This game needs WebGL, and this browser has it turned off or unavailable.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc6eeff, 160, 900);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 3000);
const sunDir = v3(-0.35, 0.32, -0.88).normalize();

const hemi = new THREE.HemisphereLight(0xd6f2ff, 0x1d6fa8, 0.9);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff6e0, 2.4);
scene.add(sunLight); scene.add(sunLight.target);

/* sky dome */
const SKY_VS = `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`;
const SKY_FS = `
uniform vec3 uTop, uHor, uSun, uSunCol; uniform float uNight, uTime;
varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir); float y = d.y;
  vec3 col = mix(uHor, uTop, pow(clamp(y, 0.0, 1.0), 0.5));
  if (y < 0.0) col = uHor;
  float s = max(dot(d, uSun), 0.0);
  col += uSunCol * (pow(s, 900.0) * 5.0 + pow(s, 64.0) * 0.4 + pow(s, 6.0) * 0.12);
  if (uNight > 0.0) {
    vec3 q = floor(d * 260.0);
    float h = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
    col += step(0.9982, h) * uNight * clamp(y * 3.0, 0.0, 1.0) * (0.6 + 0.4 * sin(uTime * 3.0 + h * 60.0));
    float band = exp(-pow((y - 0.32 - 0.05 * sin(d.x * 6.0 + uTime * 0.3)) * 9.0, 2.0));
    col += vec3(0.1, 0.9, 0.6) * band * 0.28 * uNight * (0.6 + 0.4 * sin(d.x * 14.0 + uTime));
  }
  gl_FragColor = vec4(col, 1.0);
}`;
const skyU = { uTop: { value: v3() }, uHor: { value: v3() }, uSun: { value: sunDir.clone() }, uSunCol: { value: v3(1, 1, 1) }, uNight: { value: 0 }, uTime: { value: 0 } };
const skyMat = new THREE.ShaderMaterial({ uniforms: skyU, vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false, fog: false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

/* environment map rendered from the sky so every glossy surface reflects it */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
let envRT = null;
function regenEnv() {
  const old = envRT;
  envRT = pmrem.fromScene(envScene, 0.035);
  scene.environment = envRT.texture;
  if (old) old.dispose();
}

/* ───────────────────────── ocean ───────────────────────── */
// Wave set shared by the shader and the physics so the board rides exactly what you see.
const WAVES = [[1, 0.25, 26, 0.3], [0.85, -0.5, 15, 0.17], [0.35, 1, 8.5, 0.07]].map(([dx, dz, L, a], i) => {
  const n = Math.hypot(dx, dz), k = TAU / L;
  return { kx: dx / n * k, kz: dz / n * k, a, w: Math.sqrt(9.8 * k), ph: i * 1.7 };
});
const C_SWELL = 1.5;      // swells roll toward the surfer
const CURVE = 0.0016;     // swell ridges bend away from the camera
const MAXB = 8, MAXT = 16;

const WATER_COMMON = `
uniform float uTime, uCurve; uniform vec4 uWaves[3]; uniform vec4 uBumps[${MAXB}]; uniform vec3 uCam2;
float swellH(vec2 p){
  float h = 0.0;
  for (int i = 0; i < ${MAXB}; i++) {
    vec4 b = uBumps[i];
    float u = p.x - b.x - p.y * p.y * uCurve;
    float w = u < 0.0 ? b.z : b.w;
    h += b.y * exp(-(u * u) / (w * w)) / (1.0 + p.y * p.y / 9000.0);
  }
  return h;
}
float baseH(vec2 p){
  float h = 0.0;
  for (int i = 0; i < 3; i++) { vec4 w = uWaves[i]; h += w.z * sin(dot(w.xy, p) - sqrt(9.8 * length(w.xy)) * uTime + float(i) * 1.7); }
  return h;
}`;
const WATER_VS = WATER_COMMON + `
varying vec3 vW; varying vec3 vN; varying float vSw;
float fade(vec2 p){ return 1.0 - smoothstep(150.0, 205.0, length(p - uCam2.xz)); }
float Hs(vec2 p){ float f = fade(p); return (baseH(p) + swellH(p)) * f; }
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vec2 p = wp.xz;
  float f = fade(p);
  float sw = swellH(p) * f;
  wp.y += baseH(p) * f + sw;
  float e = 0.45;
  float dx = Hs(p + vec2(e, 0.0)) - Hs(p - vec2(e, 0.0));
  float dz = Hs(p + vec2(0.0, e)) - Hs(p - vec2(0.0, e));
  vN = normalize(vec3(-dx / (2.0 * e), 1.0, -dz / (2.0 * e)));
  vW = wp.xyz; vSw = sw;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const WATER_FS = `
uniform float uTime, uNight; uniform vec3 uDeep, uShallow, uFoam, uSkyTop, uSkyHor, uSunDir, uSunCol;
uniform vec4 uTrail[${MAXT}];
varying vec3 vW; varying vec3 vN; varying float vSw;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
void main(){
  vec2 q = vW.xz; float t = uTime;
  vec3 n = normalize(vN + vec3(
    0.05 * sin(q.x * 1.9 + t * 2.3) + 0.035 * sin(q.x * 3.7 - q.y * 2.9 + t * 3.1) + 0.02 * sin(q.x * 7.1 + q.y * 5.3 - t * 4.0),
    0.0,
    0.05 * sin(q.y * 2.1 - t * 1.9) + 0.035 * sin(q.y * 4.3 + q.x * 1.7 + t * 2.7) + 0.02 * sin(q.y * 8.3 - q.x * 3.1 + t * 3.6)));
  vec3 v = normalize(cameraPosition - vW);
  float ndv = max(dot(n, v), 0.0);
  float fres = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  vec3 r = reflect(-v, n);
  vec3 sky = mix(uSkyHor, uSkyTop, pow(clamp(r.y, 0.0, 1.0), 0.6));
  float rs = max(dot(r, uSunDir), 0.0);
  sky += uSunCol * pow(rs, 6.0) * 0.25;
  // body: deep water, turquoise where light passes through raised water
  float lift = clamp(vW.y * 0.22 + 0.45, 0.0, 1.0);
  vec3 body = mix(uDeep, uShallow, 0.18 + lift * 0.5);
  float thru = clamp(vSw * 0.28, 0.0, 1.0) * pow(max(dot(v, -uSunDir * vec3(1.0, 0.0, 1.0) + vec3(0.0, 0.25, 0.0)), 0.0), 2.0);
  body += uShallow * (0.55 * thru + 0.25 * clamp(vSw * 0.2, 0.0, 1.0) * (1.0 - n.y * 0.6));
  vec3 col = mix(body, sky, clamp(fres * 1.15, 0.0, 1.0));
  // sun glitter
  vec3 h = normalize(uSunDir + v);
  float nh = max(dot(n, h), 0.0);
  col += uSunCol * (pow(nh, 400.0) * 4.0 + pow(nh, 60.0) * 0.35);
  // foam: steep swell faces, swell crests, and the surfer's wake
  float steep = smoothstep(0.1, 0.3, 1.0 - vN.y) * smoothstep(0.6, 2.0, vSw);
  float crest = smoothstep(2.2, 4.5, vSw) * 0.5;
  float wake = 0.0;
  for (int i = 0; i < ${MAXT}; i++) {
    vec4 tr = uTrail[i];
    vec2 d = q - tr.xy;
    float rad = 0.35 + tr.z * 2.2;
    wake += tr.w * exp(-dot(d, d) / (rad * rad)) * (1.0 - clamp(tr.z, 0.0, 1.0));
  }
  float nz = noise(q * 1.7 + t * 0.6) * 0.6 + noise(q * 4.3 - t) * 0.4;
  float foam = clamp((steep + crest) * smoothstep(0.35, 0.75, nz) * 1.4 + wake * smoothstep(0.2, 0.6, nz + 0.2), 0.0, 1.0);
  col = mix(col, uFoam, foam * 0.92);
  col += uShallow * uNight * 0.12 * smoothstep(0.5, 0.9, nz);
  float dist = length(cameraPosition - vW);
  col = mix(col, uSkyHor, smoothstep(160.0, 900.0, dist));
  gl_FragColor = vec4(col, 1.0);
}`;
const waterU = {
  uTime: { value: 0 }, uCurve: { value: CURVE }, uNight: { value: 0 },
  uWaves: { value: WAVES.map(w => new THREE.Vector4(w.kx, w.kz, w.a, w.w)) },
  uBumps: { value: Array.from({ length: MAXB }, () => new THREE.Vector4(0, 0, 1, 1)) },
  uTrail: { value: Array.from({ length: MAXT }, () => new THREE.Vector4(0, 0, 1, 0)) },
  uCam2: { value: v3() },
  uDeep: { value: v3() }, uShallow: { value: v3() }, uFoam: { value: v3() }, uSkyTop: { value: v3() }, uSkyHor: { value: v3() },
  uSunDir: { value: sunDir.clone() }, uSunCol: { value: v3(1, 1, 1) },
};
const waterMat = new THREE.ShaderMaterial({ uniforms: waterU, vertexShader: WATER_VS, fragmentShader: WATER_FS, fog: false });

// Near ocean: a grid that is dense around the surfer and coarse toward the edges.
function axis(min, max, center, base, grow) {
  const out = [];
  for (let x = center; x <= max; x += base + Math.abs(x - center) * grow) out.push(x);
  for (let x = center - (base); x >= min; x -= base + Math.abs(x - center) * grow) out.unshift(x);
  if (out[0] > min) out.unshift(min);
  if (out[out.length - 1] < max) out.push(max);
  return out;
}
function makeOcean() {
  const xs = axis(-260, 380, 0, 0.45, 0.011), zs = axis(-205, 32, 0, 0.45, 0.019);
  const pos = new Float32Array(xs.length * zs.length * 3);
  let k = 0;
  for (const z of zs) for (const x of xs) { pos[k++] = x; pos[k++] = 0; pos[k++] = z; }
  const idx = [];
  const nx = xs.length;
  for (let j = 0; j < zs.length - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const ocean = new THREE.Mesh(makeOcean(), waterMat);
ocean.frustumCulled = false; scene.add(ocean);
const farOcean = new THREE.Mesh(new THREE.PlaneGeometry(9000, 4000, 1, 1).rotateX(-Math.PI / 2), waterMat);
farOcean.frustumCulled = false; scene.add(farOcean);

/* physics view of the same surface (z = 0 is the riding line) */
let bumps = [];
function swellAt(x, t) {
  let h = 0;
  for (const b of bumps) {
    const u = x - (b.x0 - C_SWELL * t);
    if (u < -4 * b.wl || u > 4 * b.wr) continue;
    const w = u < 0 ? b.wl : b.wr;
    h += b.a * Math.exp(-(u * u) / (w * w));
  }
  return h;
}
function baseAt(x, z, t) { let h = 0; for (const w of WAVES) h += w.a * Math.sin(w.kx * x + w.kz * z - w.w * t + w.ph); return h; }
const H = (x, t) => baseAt(x, 0, t) + swellAt(x, t);
const slopeAt = (x, t) => (H(x + 0.05, t) - H(x - 0.05, t)) / 0.1;

/* ───────────────────────── scenery ───────────────────────── */
const tex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const cloudTex = tex(512, 256, (g, w, h) => {
  const blobs = [[0.3, 0.62, 0.2], [0.45, 0.45, 0.26], [0.62, 0.52, 0.22], [0.76, 0.64, 0.16], [0.2, 0.7, 0.13], [0.52, 0.68, 0.2]];
  for (const [x, y, r] of blobs) {
    const gr = g.createRadialGradient(x * w, y * h - r * h * 0.3, r * h * 0.1, x * w, y * h, r * h * 1.25);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.7, 'rgba(246,251,255,0.95)'); gr.addColorStop(1, 'rgba(225,240,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x * w, y * h, r * h * 1.25, 0, TAU); g.fill();
  }
});
const dotTex = tex(64, 64, (g) => {
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});

const clouds = [];
for (let i = 0; i < 16; i++) {
  const m = new THREE.SpriteMaterial({ map: cloudTex, fog: false, depthWrite: false, transparent: true, toneMapped: false });
  const s = new THREE.Sprite(m);
  const sc = rand(150, 320); s.scale.set(sc, sc * 0.5, 1);
  s.userData = { dx: rand(-700, 900), y: rand(70, 260), z: rand(-1100, -650), par: rand(0.75, 0.92) };
  s.renderOrder = -5; scene.add(s); clouds.push(s);
}

const glossy = (color, extra) => new THREE.MeshPhysicalMaterial(Object.assign({ color, roughness: 0.25, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08 }, extra || {}));
const islandMat = glossy(0x4cc95a, { roughness: 0.35 }), sandMat = glossy(0xffe9b5, { roughness: 0.6, clearcoat: 0.3 }), trunkMat = glossy(0x9c7a55, { roughness: 0.5 }), leafMat = glossy(0x3ccf5a);
function makeIsland() {
  const g = new THREE.Group();
  const s = rand(0.7, 1.4);
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20), islandMat); body.scale.set(38 * s, 13 * s, 24 * s); body.position.y = -3 * s; g.add(body);
  const sand = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 12), sandMat); sand.scale.set(48 * s, 3.2, 31 * s); sand.position.y = -1.6; g.add(sand);
  const palms = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < palms; i++) {
    const px = rand(-22, 22) * s, pz = rand(-10, 10) * s, base = 6 * s * Math.sqrt(Math.max(0, 1 - (px / (38 * s)) ** 2 - (pz / (24 * s)) ** 2)) - 1;
    const hgt = rand(10, 16), lean = rand(-4, 4);
    const curve = new THREE.CatmullRomCurve3([v3(px, base, pz), v3(px + lean * 0.4, base + hgt * 0.5, pz), v3(px + lean, base + hgt, pz)]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.55, 8), trunkMat));
    const top = v3(px + lean, base + hgt, pz);
    for (let k = 0; k < 6; k++) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), leafMat);

  glass(m, m, dW, h, h / 2, tint);
  ctx.textAlign = 'left'; ctx.font = fu(fs * 0.55, 600); ctx.fillStyle = 'rgba(13,59,102,0.7)';
  ctx.fillText('DISTANCE', m + h * 0.45, m + h * 0.3);
  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY; ctx.fillText(`${fmt(Math.floor(dist))} m`, m + h * 0.45, m + h * 0.66);
  const sW = Math.max(150, fs * 8);
  glass(W - m - sW, m, sW, h, h / 2, tint);
  ctx.textAlign = 'right'; ctx.font = fu(fs * 0.55, 600); ctx.fillStyle = 'rgba(13,59,102,0.7)';
  ctx.fillText('SCORE', W - m - h * 0.45, m + h * 0.3);
  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY; ctx.fillText(fmt(score()), W - m - h * 0.45, m + h * 0.66);
  if (combo > 1) {
    const cw = h * 1.9, cx = W - m - cw, cy = m + h + 10;
    gem(cx, cy, cw, h * 0.8, pal.accent);
    ctx.textAlign = 'center'; ctx.font = fd(fs * 1.05); shadowText(`×${combo}`, cx + cw / 2, cy + h * 0.4, '#fff', 3);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; rr(cx + 8, cy + h * 0.8 + 6, cw - 16, 5, 2.5); ctx.fill();
    ctx.fillStyle = rgba(pal.accent); rr(cx + 8, cy + h * 0.8 + 6, (cw - 16) * clamp(comboT / 3, 0, 1), 5, 2.5); ctx.fill();
  }
  if (W > 760) {
    ctx.textAlign = 'center'; ctx.font = fu(fs * 0.6, 600);
    const zt = `Zone ${pal.zone + 1}  ·  ${pal.name}`, zw = ctx.measureText(zt).width + 30;
    glass(W / 2 - zw / 2, m + h * 0.15, zw, h * 0.7, h * 0.35, tint);
    ctx.fillStyle = NAVY; ctx.fillText(zt, W / 2, m + h * 0.5);
  }
}

function drawLogo(x, y, size) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = fd(size);
  const g = ctx.createLinearGradient(0, y - size * 0.8, 0, y);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.48, '#e4f6ff'); g.addColorStop(0.52, rgba(mixC(pal.accent, WHITE, 0.35))); g.addColorStop(1, rgba(pal.accent));
  ctx.save(); ctx.shadowColor = 'rgba(0,50,120,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 5;
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.07; ctx.strokeStyle = '#ffffff'; ctx.strokeText('Aero', x, y); ctx.restore();
  ctx.fillStyle = g; ctx.fillText('Aero', x, y);
}
function drawTitle() {
  const u = UIS, size = Math.max(70, 170 * u), x = Math.max(24, W * 0.07), y = H_ * 0.36;
  drawLogo(x, y, size);
  ctx.font = fd(Math.max(18, 38 * u));
  const sub = 'SURF', tw = ctx.measureText(sub).width, sw = tw + Math.max(36, 64 * u), sh = Math.max(30, 56 * u);
  gem(x + size * 0.05, y + size * 0.2, sw, sh, pal.accent);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  shadowText(sub, x + size * 0.05 + (sw - tw) / 2, y + size * 0.2 + sh * 0.53, '#fff', 3);
  const fs = Math.max(12, 16 * u), px = x, py = y + size * 0.2 + sh + fs * 1.4;
  const lines = [['Tap / Space', 'Jump'], ['Hold in the air', 'Backflip'], ['Land with the wave', 'Keep surfing']];
  const pw = Math.min(W - px * 2, fs * 22), ph = fs * 1.8 * lines.length + fs * 1.2;
  glass(px, py, pw, ph, fs * 0.9, skyTint(), true);
  lines.forEach(([a, b], i) => {
    const yy = py + fs * 1.5 + i * fs * 1.8;
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.font = fu(fs, 600); ctx.fillText(a, px + fs * 1.1, yy);
    ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.font = fu(fs, 700); ctx.fillText(b, px + pw - fs * 1.1, yy);
  });
  const bs = 1 + Math.sin(time * 4) * 0.03;
  ctx.font = fu(fs * 1.1, 700);
  const bt = 'Press to start', bw = ctx.measureText(bt).width + fs * 3, bh = fs * 2.8;
  ctx.save(); ctx.translate(px + bw / 2, py + ph + bh * 0.9); ctx.scale(bs, bs);
  gem(-bw / 2, -bh / 2, bw, bh, [60, 200, 90]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; shadowText(bt, 0, 1, '#fff', 3);
  ctx.restore();
  ctx.font = fu(Math.max(11, 13 * u), 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  shadowText(custom ? 'Custom surfer loaded. Press R to turn it.' : 'Got a Meshy model? Drop a .glb here or tap Load 3D model.', px, py + ph + bh * 1.9, '#fff', 6);
}
function drawDead() {
  if (deadT < 0.45) return;
  const a = clamp((deadT - 0.45) / 0.3, 0, 1), fs = Math.max(13, 17 * UIS);
  ctx.fillStyle = `rgba(0,40,100,${0.25 * a})`; ctx.fillRect(0, 0, W, H_);
  const pw = Math.min(W - 32, Math.max(320, fs * 24)), ph = fs * 19, px = (W - pw) / 2, py = Math.max(16, (H_ - ph) / 2);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 30);
  glass(px, py, pw, ph, fs * 1.2, skyTint(), true);
  gem(px + fs, py + fs, pw - fs * 2, fs * 3.2, [255, 110, 90]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = fd(fs * 2);
  shadowText('Wipeout!', W / 2, py + fs * 2.65, '#fff', 3);
  ctx.font = fu(fs, 600); ctx.fillStyle = NAVY; ctx.fillText(deathReason, W / 2, py + fs * 5.6);
  const rows = [['Distance', `${fmt(Math.floor(dist))} m`], ['Score', fmt(score())], ['Backflips', String(runFlips)], ['Best', fmt(best) + (newBest ? '  New best!' : '')]];
  rows.forEach(([kk, v], i) => {
    const yy = py + fs * 7.8 + i * fs * 1.9;
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(px + fs * 1.2, yy - fs * 0.8, pw - fs * 2.4, fs * 1.6, fs * 0.8); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.font = fu(fs, 600); ctx.fillText(kk, px + fs * 2, yy);
    ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.font = fu(fs, 700); ctx.fillText(v, px + pw - fs * 2, yy);
  });
  if (deadT > 1.0) {
    const bt = 'Tap to try again', bh = fs * 2.6; ctx.font = fu(fs * 1.05, 700);
    const bw = ctx.measureText(bt).width + fs * 3;
    gem(W / 2 - bw / 2, py + ph - bh - fs * 1.1, bw, bh, [60, 200, 90]);
    ctx.textAlign = 'center'; shadowText(bt, W / 2, py + ph - bh / 2 - fs * 1.1 + 1, '#fff', 3);
  }
  ctx.restore();
}
function drawUI() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H_);
  drawLensFlare();
  if (flashA > 0.01) { ctx.fillStyle = `rgba(255,255,255,${flashA})`; ctx.fillRect(0, 0, W, H_); }
  if (state === 'play' && playT < 7) {
    ctx.font = fu(Math.max(12, 15 * UIS), 700);
    const t = playT < 3.5 ? 'Tap to jump' : 'Hold in the air to backflip. Land with the wave!';
    const w = ctx.measureText(t).width + 32, h = Math.max(32, 40 * UIS), y = H_ - h - 64;
    glass(W / 2 - w / 2, y, w, h, h / 2, skyTint(), true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = NAVY; ctx.fillText(t, W / 2, y + h / 2 + 1);
  }
  drawCallouts();
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'dead') drawDead();
  if (modelNoteT > 0 && modelNote) {
    ctx.font = fu(Math.max(12, 14 * UIS), 600);
    const w = ctx.measureText(modelNote).width + 30, h = 34;
    glass(W / 2 - w / 2, H_ - 120, w, h, h / 2, skyTint(), true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = NAVY; ctx.fillText(modelNote, W / 2, H_ - 120 + h / 2 + 1);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,40,100,0.3)'; ctx.fillRect(0, 0, W, H_);
    const fs = Math.max(14, 18 * UIS), pw = fs * 16, ph = fs * 7;
    glass(W / 2 - pw / 2, H_ / 2 - ph / 2, pw, ph, fs, skyTint(), true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fd(fs * 2.2); ctx.fillStyle = NAVY; ctx.fillText('Paused', W / 2, H_ / 2 - fs * 0.8);
    ctx.font = fu(fs, 600); ctx.fillText('Press to resume', W / 2, H_ / 2 + fs * 1.5);
  }
}

/* ───────────────────────── input ───────────────────────── */
function press() {
  initAudio();
  if (paused) { paused = false; return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'dead') { if (deadT > 1.0) startGame(); return; }
  input.held = true; input.queued = true;
}
const release = () => { input.held = false; };
const fileIn = document.getElementById('file');
for (const id of ['mute', 'model']) document.getElementById(id).addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('mute').addEventListener('click', e => { e.stopPropagation(); initAudio(); setMute(!AU.on); e.currentTarget.blur(); });
document.getElementById('model').addEventListener('click', e => { e.stopPropagation(); fileIn.click(); e.currentTarget.blur(); });
fileIn.addEventListener('change', () => { loadFile(fileIn.files[0]); fileIn.value = ''; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#controls')) return; e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('blur', () => { release(); if (state === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyX', 'Enter'];
window.addEventListener('keydown', e => {
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') { initAudio(); setMute(!AU.on); }
  else if (e.code === 'KeyR' && custom) { modelYaw += Math.PI / 2; }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) release(); });

/* ───────────────────────── loop ───────────────────────── */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (!paused) update(dt);
  renderer.render(scene, camera);
  drawUI();
  requestAnimationFrame(frame);
}
function boot(data) {
  if (data && data.best) best = Math.max(best, data.best | 0);
  resize();
  resetWorld(true);
  updatePalette();
  window.__aeroBooted = true;
  document.getElementById('fail').hidden = true;
  requestAnimationFrame(t => { last = t; frame(t); });
}
// test hook: fast-forward the simulation without rendering
window.__aeroAdvance = (sec, play) => { if (play && state !== 'play') startGame(); for (let i = 0; i < sec * 60; i++) update(1 / 60); return { state, dist: Math.round(dist), flips: runFlips, mode: R.mode, reason: deathReason }; };
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ best })); } catch (e) { }
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
</script>
</body>
