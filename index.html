<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aero Surf">
<meta name="theme-color" content="#3aa6ff">
<link rel="manifest" href="manifest.webmanifest">
<title>Aero Surf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: side-on WebGL scene full-bleed, a 2D canvas on top for glass HUD, two glossy pills bottom-right. Single look by design. */
:root {
  --sky: #3aa6ff;
  --navy: #0d3b66;
  --glass: rgba(255, 255, 255, 0.75);
  --glass-low: rgba(191, 230, 255, 0.62);
  --aqua: #1aa7ff;
  --font-ui: "Open Sans", "Segoe UI", Frutiger, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  background: var(--sky);
}
html, body { height: 100%; margin: 0; background: var(--sky); color: var(--navy); overflow: hidden; }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; box-sizing: border-box; }
#sa { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--font-ui); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { pointer-events: none; }
#controls { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 8px; }
.pill {
  font: 700 12px/1 var(--font-ui); color: var(--navy);
  background: linear-gradient(180deg, var(--glass) 0%, var(--glass) 48%, var(--glass-low) 52%, var(--glass-low) 100%);
  border: 1px solid #fff; border-radius: 999px; padding: 8px 14px;
  box-shadow: 0 2px 8px rgba(0, 50, 110, 0.25), inset 0 1px 0 #fff; cursor: pointer;
}
.pill:hover { filter: brightness(1.06); }
@media (max-height: 430px) { .pill { font-size: 10px; padding: 5px 10px; } #controls { gap: 6px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); } }
.pill:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 600 16px/1.5 var(--font-ui); color: var(--navy); background: var(--sky); }
#fail[hidden] { display: none; }
#fail p { max-width: 34ch; background: var(--glass); border: 1px solid #fff; border-radius: 16px; padding: 18px 20px; margin: 0; }
</style>
</head>
<body>
<canvas id="gl" aria-label="Aero Surf. Hold to push into the wave, release to launch."></canvas>
<canvas id="ui"></canvas>
<div id="sa" aria-hidden="true"></div>
<div id="controls">
  <button id="full" class="pill" type="button" hidden>Full screen</button>
  <button id="night" class="pill" type="button" aria-pressed="false">Night mode</button>
  <button id="skin" class="pill" type="button">Skin</button>
  <button id="model" class="pill" type="button">Load 3D model</button>
  <button id="mute" class="pill" type="button" aria-pressed="false">Sound on</button>
</div>
<input id="file" type="file" accept=".glb,.gltf,model/gltf-binary" hidden>
<div id="fail" hidden><p id="failmsg">Loading the 3D engine…</p></div>

<script>
setTimeout(() => {
  if (!window.__aeroBooted) {
    document.getElementById('fail').hidden = false;
    document.getElementById('failmsg').textContent = 'The 3D engine could not load. Check your internet connection and reload. This game needs a browser with WebGL.';
  }
}, 12000);
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm';
import { mergeGeometries } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js/+esm';

/* ───────────────────────── utilities ───────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const smooth = t => t * t * (3 - 2 * t);
const hex = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [255, 255, 255];
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const c3 = c => v3(c[0] / 255, c[1] / 255, c[2] / 255);
const srgb = (col, c) => col.setRGB(c[0] / 255, c[1] / 255, c[2] / 255, THREE.SRGBColorSpace);

/* ───────────────────────── palettes: Killer 7 color, Frutiger Aero gloss ───────────────────────── */
const PAL_DEF = [
  { name: 'Crystal Lagoon', root: 146.8, skyTop: '#0038d0', skyMid: '#168cff', skyHor: '#c4f6ff', sun: '#ffffff', beam: '#ffffff', wTop: '#19f0c8', wMid: '#00a2d0', wDeep: '#004a8a', rim: '#ffffff', isl: '#3be05a', islD: '#0a8a5a', tower: '#7ad0ff', bed: '#36d84a', accent: '#00a0ff', bubble: '#c8f8ff' },
  { name: 'Emerald Bay', root: 130.8, skyTop: '#0030b8', skyMid: '#0aa4ff', skyHor: '#d8fff0', sun: '#ffffff', beam: '#f4fff0', wTop: '#3dff8a', wMid: '#00b490', wDeep: '#00507a', rim: '#ffffff', isl: '#6aff3a', islD: '#0a7a3a', tower: '#8ae8d8', bed: '#8cff2a', accent: '#00c060', bubble: '#d0ffe0' },
  { name: 'Deep Blue', root: 123.5, skyTop: '#001a90', skyMid: '#0062ff', skyHor: '#a4e4ff', sun: '#ffffff', beam: '#e8f6ff', wTop: '#00d0ff', wMid: '#0058d8', wDeep: '#001a60', rim: '#ffffff', isl: '#2ad0a0', islD: '#005a7a', tower: '#5aa0ff', bed: '#22c0a8', accent: '#2a7dff', bubble: '#b8dcff' },
  { name: 'Lime Rain', root: 164.8, skyTop: '#0064cc', skyMid: '#29c0ff', skyHor: '#f0ffb8', sun: '#ffffff', beam: '#fbffe0', wTop: '#b8ff2a', wMid: '#10b860', wDeep: '#00466a', rim: '#ffffff', isl: '#c8ff00', islD: '#2a9a20', tower: '#a0f0c0', bed: '#d8ff3a', accent: '#36b800', bubble: '#f0ffc8' },
  { name: 'Aqua Aurora', root: 110.0, skyTop: '#001048', skyMid: '#0044b0', skyHor: '#30e8d8', sun: '#e8ffff', beam: '#c0fff4', wTop: '#00ffd0', wMid: '#0076b0', wDeep: '#001040', rim: '#ffffff', isl: '#00c890', islD: '#004a5a', tower: '#3a7ac0', bed: '#00b890', accent: '#00d8a0', bubble: '#a8fff4' },
];
const CKEYS = ['skyTop', 'skyMid', 'skyHor', 'sun', 'beam', 'wTop', 'wMid', 'wDeep', 'rim', 'isl', 'islD', 'tower', 'bed', 'accent', 'bubble'];
const PALS = PAL_DEF.map(p => { const o = { name: p.name, root: p.root }; CKEYS.forEach(k => o[k] = hex(p[k])); return o; });
const PAL_NIGHT_DEF = [
  { name: 'Moonlit Lagoon', root: 98.0, skyTop: '#020824', skyMid: '#0a2a6a', skyHor: '#1c4a88', sun: '#eef6ff', beam: '#a8c8ff', wTop: '#0a92b0', wMid: '#03305e', wDeep: '#010a24', rim: '#c8f4ff', isl: '#1a6a5a', islD: '#02202a', tower: '#1a2a5a', bed: '#0a6a5a', accent: '#3aa0ff', bubble: '#a0e8ff' },
  { name: 'Bioluminescence', root: 110.0, skyTop: '#01040f', skyMid: '#061a3a', skyHor: '#0a4a6a', sun: '#d8fff8', beam: '#80ffe0', wTop: '#00c8a0', wMid: '#002a48', wDeep: '#00050f', rim: '#a0fff0', isl: '#0a4a3a', islD: '#001a14', tower: '#0a3a4a', bed: '#00a080', accent: '#00f0b0', bubble: '#80fff0' },
  { name: 'Aurora Night', root: 123.5, skyTop: '#050018', skyMid: '#1a0a5a', skyHor: '#3ad0a0', sun: '#f0e8ff', beam: '#c0a0ff', wTop: '#22c890', wMid: '#141f5e', wDeep: '#030018', rim: '#e0d8ff', isl: '#2a3a8a', islD: '#08082a', tower: '#2a1a6a', bed: '#3a2a9a', accent: '#a070ff', bubble: '#d0c0ff' },
  { name: 'Midnight Neon', root: 87.3, skyTop: '#0a0014', skyMid: '#3a0a5a', skyHor: '#ff3aa0', sun: '#fff0f8', beam: '#ff80d0', wTop: '#c828b0', wMid: '#200852', wDeep: '#05000f', rim: '#ffd0f0', isl: '#5a1a8a', islD: '#12002a', tower: '#3a0a6a', bed: '#6a1a8a', accent: '#ff3aa8', bubble: '#ffb0e8' },
];
const PALS_N = PAL_NIGHT_DEF.map(p => { const o = { name: p.name, root: p.root }; CKEYS.forEach(k => o[k] = hex(p[k])); return o; });
let nightMode = false, nightBlend = 0;
try { nightMode = localStorage.getItem('aero-surf-night') === '1'; nightBlend = nightMode ? 1 : 0; } catch (e) { }
const pal = { name: PALS[0].name, root: PALS[0].root, zone: 0, key: '' };
CKEYS.forEach(k => pal[k] = PALS[0][k].slice());

/* ───────────────────────── renderer, camera, lights ───────────────────────── */
const glc = document.getElementById('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('fail').hidden = false; document.getElementById('failmsg').textContent = 'This game needs WebGL, and this browser has it turned off or unavailable.'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8f6ff, 260, 1300);
const camera = new THREE.PerspectiveCamera(44, 1, 0.5, 4000);
const sunDir = v3(0.42, 0.22, -0.88).normalize();

const hemi = new THREE.HemisphereLight(0xffffff, 0x2266aa, 1.0); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.6); scene.add(key); scene.add(key.target);
const rimL = new THREE.DirectionalLight(0x1aa7ff, 2.6); scene.add(rimL); scene.add(rimL.target);

/* ───────────────────────── the wave function (shared by GPU and physics) ───────────────────────── */
const MAXB = 16, MAXT = 16, CUT = 2.5, CURVE = 0.0016, C_SWELL = 5.0;
const WAVES = [[-1, 0.25, 26, 0.13], [-0.85, -0.5, 15, 0.08], [-0.35, 1, 8.5, 0.045]].map(([dx, dz, L, a], i) => {
  const n = Math.hypot(dx, dz), k = TAU / L; return { kx: dx / n * k, kz: dz / n * k, a, w: Math.sqrt(9.8 * k), ph: i * 1.7 };
});
const SHARED_U = {
  uTime: { value: 0 }, uCurve: { value: CURVE }, uDusk: { value: 0 }, uFever: { value: 0 },
  uWaves: { value: WAVES.map(w => new THREE.Vector4(w.kx, w.kz, w.a, w.w)) },
  uBumps: { value: Array.from({ length: MAXB }, () => new THREE.Vector4(0, 0, 1, 1)) },
  uTrail: { value: Array.from({ length: MAXT }, () => new THREE.Vector4(0, 0, 1, 0)) },
  uCamP: { value: v3() }, uSun: { value: sunDir.clone() }, uNight: { value: 0 },
};
const PALU = CKEYS.reduce((o, k) => (o['u_' + k] = { value: v3() }, o), {});
const PAL_GLSL = CKEYS.map(k => `uniform vec3 u_${k};`).join('\n');
const U = extra => Object.assign({}, SHARED_U, PALU, extra || {});
const H_GLSL = `
uniform float uTime, uCurve, uDusk, uFever; uniform vec4 uWaves[3]; uniform vec4 uBumps[${MAXB}]; uniform vec3 uCamP, uSun;
float swellH(vec2 p){
  float h = 0.0;
  for (int i = 0; i < ${MAXB}; i++) { vec4 b = uBumps[i]; float u = p.x - b.x - p.y * p.y * uCurve; float w = u < 0.0 ? b.z : b.w;
    h += b.y * exp(-(u * u) / (w * w)) / (1.0 + p.y * p.y / 9000.0); }
  return h;
}
float baseH(vec2 p){ float h = 0.0; for (int i = 0; i < 3; i++) { vec4 w = uWaves[i]; h += w.z * sin(dot(w.xy, p) - w.w * uTime + float(i) * 1.7); } return h; }
float H3(vec2 p){ return baseH(p) + swellH(p); }
float seabed(float x, float z){ return -12.5 - 1.6 * sin(x * 0.045) - 0.9 * sin(x * 0.11 + 1.3) - 0.4 * sin(x * 0.27 + 0.4) + 0.8 * sin(z * 0.21 + x * 0.03) - z * 0.04; }
vec3 dusk(vec3 c){ return mix(c, c * vec3(0.28, 0.3, 0.55), uDusk); }`;
let bumps = [];
function H(x, t) {
  let h = 0;
  for (const b of bumps) {
    const u = x - (b.x0 - C_SWELL * t);
    if (u < -4 * b.wl || u > 4 * b.wr) continue;
    const w = u < 0 ? b.wl : b.wr; h += b.a * Math.exp(-(u * u) / (w * w));
  }
  for (const w of WAVES) h += w.a * Math.sin(w.kx * x - w.w * t + w.ph);
  return h;
}
const slopeAt = (x, t) => (H(x + 0.05, t) - H(x - 0.05, t)) / 0.1;
const seabedZ = (x, z) => -12.5 - 1.6 * Math.sin(x * 0.045) - 0.9 * Math.sin(x * 0.11 + 1.3) - 0.4 * Math.sin(x * 0.27 + 0.4) + 0.8 * Math.sin(z * 0.21 + x * 0.03) - z * 0.04;
const seabed = x => seabedZ(x, 0);

/* ───────────────────────── sky dome with hard light shafts ───────────────────────── */
const skyMat = new THREE.ShaderMaterial({
  uniforms: U(), side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }',
  fragmentShader: `${PAL_GLSL}
uniform float uTime, uDusk, uFever, uNight; uniform vec3 uSun; varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir); float y = d.y;
  vec3 col = mix(u_skyHor, u_skyMid, smoothstep(0.0, 0.22, y));
  col = mix(col, u_skyTop, smoothstep(0.18, 0.8, y));
  if (y < 0.0) col = u_skyHor;
  float s = max(dot(d, uSun), 0.0);
  col = mix(col, u_sun, smoothstep(mix(0.99855, 0.99775, uNight), mix(0.9989, 0.9981, uNight), s));
  col += u_sun * (pow(s, 70.0) * 0.5 + pow(s, 6.0) * 0.14) * (1.0 - 0.75 * uNight) + u_sun * pow(s, 400.0) * 0.4 * uNight;
  vec3 t1 = normalize(cross(uSun, vec3(0.0, 1.0, 0.0))), t2 = cross(t1, uSun);
  float a = atan(dot(d, t2), dot(d, t1));
  float sh = step(0.86 - 0.08 * uFever, sin(a * 7.0 + uTime * (0.04 + uFever * 0.6))) * smoothstep(0.25, 0.97, s) * step(-0.01, y);
  col = mix(col, u_beam, sh * 0.24 * (1.0 - 0.7 * uNight));
  float ra = acos(clamp(dot(d, normalize(vec3(0.42, -0.02, -1.0))), -1.0, 1.0));
  float rt = (ra - 0.28) / 0.045;
  if (rt > 0.0 && rt < 1.0 && y > 0.0) {
    vec3 rc = clamp(abs(mod((1.0 - rt) * 4.8 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    col = mix(col, rc, 0.32 * sin(rt * 3.14159) * smoothstep(0.0, 0.06, y) * (1.0 - uNight));
  }
  col = mix(col, col * vec3(0.25, 0.28, 0.5), uDusk);
  vec3 q = floor(d * 260.0);
  float h = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
  col += step(mix(0.9982, 0.9962, uNight), h) * max(uDusk, uNight) * 1.3 * clamp(y * 3.0, 0.0, 1.0) * (0.65 + 0.35 * sin(uTime * 3.0 + h * 80.0));
  float band = exp(-pow((y - 0.3 - 0.06 * sin(d.x * 5.0 + uTime * 0.25)) * 8.0, 2.0)) + 0.6 * exp(-pow((y - 0.45 - 0.05 * sin(d.x * 7.0 - uTime * 0.2)) * 10.0, 2.0));
  col += u_beam * band * 0.32 * uNight * (0.55 + 0.45 * sin(d.x * 12.0 + uTime * 0.7));
  gl_FragColor = vec4(col, 1.0);
}` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(1600, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function regenEnv() { const old = envRT; envRT = pmrem.fromScene(envScene, 0.035); scene.environment = envRT.texture; if (old) old.dispose(); }

/* ───────────────────────── 3D ocean surface ───────────────────────── */
const surfMat = new THREE.ShaderMaterial({ uniforms: U(), fog: false,
  vertexShader: `${H_GLSL}
varying vec3 vW; varying vec3 vN; varying float vSw;
float fade(vec2 p){ return 1.0 - smoothstep(170.0, 230.0, length(p - uCamP.xz)); }
float Hs(vec2 p){ return H3(p) * fade(p); }
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0); vec2 p = wp.xz; float f = fade(p);
  float sw = swellH(p) * f; wp.y += baseH(p) * f + sw;
  float e = 0.45;
  float dx = Hs(p + vec2(e, 0.0)) - Hs(p - vec2(e, 0.0)), dz = Hs(p + vec2(0.0, e)) - Hs(p - vec2(0.0, e));
  vN = normalize(vec3(-dx / (2.0 * e), 1.0, -dz / (2.0 * e))); vW = wp.xyz; vSw = sw;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`,
  fragmentShader: `${PAL_GLSL}
uniform float uTime, uDusk, uNight; uniform vec3 uSun; uniform vec4 uTrail[${MAXT}];
varying vec3 vW; varying vec3 vN; varying float vSw;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
void main(){
  vec2 q = vW.xz; float t = uTime;
  vec3 n = normalize(vN + vec3(0.025 * sin(q.x * 1.9 + t * 2.3) + 0.018 * sin(q.x * 3.7 - q.y * 2.9 + t * 3.1), 0.0,
                               0.025 * sin(q.y * 2.1 - t * 1.9) + 0.018 * sin(q.y * 4.3 + q.x * 1.7 + t * 2.7)));
  vec3 v = normalize(cameraPosition - vW);
  float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
  vec3 r = reflect(-v, n);
  vec3 sky = mix(mix(u_skyHor, u_skyMid, 0.45), u_skyTop, smoothstep(0.0, 0.5, r.y));
  sky += u_sun * pow(max(dot(r, uSun), 0.0), 6.0) * 0.25;
  float lift = clamp(vW.y * 0.22 + 0.45, 0.0, 1.0);
  vec3 body = mix(u_wMid, u_wTop, 0.25 + lift * 0.5);
  body += u_wTop * 0.35 * clamp(vSw * 0.25, 0.0, 1.0);
  vec3 col = mix(body, sky, clamp(fres * 0.85, 0.0, 0.85));
  float nh = max(dot(n, normalize(uSun + v)), 0.0);
  col += u_sun * (pow(nh, 400.0) * 4.0 + pow(nh, 60.0) * 0.3);
  float steep = smoothstep(0.1, 0.3, 1.0 - vN.y) * smoothstep(0.6, 2.0, vSw), crest = smoothstep(2.4, 4.8, vSw) * 0.45;
  float wake = 0.0;
  for (int i = 0; i < ${MAXT}; i++) { vec4 tr = uTrail[i]; vec2 d = q - tr.xy; float rad = 0.35 + tr.z * 2.2; wake += tr.w * exp(-dot(d, d) / (rad * rad)) * (1.0 - clamp(tr.z, 0.0, 1.0)); }
  float nz = noise(q * 1.7 + t * 0.6) * 0.6 + noise(q * 4.3 - t) * 0.4;
  float foam = clamp((steep + crest) * smoothstep(0.35, 0.75, nz) * 1.4 + wake * smoothstep(0.2, 0.6, nz + 0.2), 0.0, 1.0);
  col = mix(col, u_rim, foam * 0.92);
  float spk = step(0.985, hash(floor(q * 2.5) + floor(t * 3.0)));
  col += u_accent * (foam * 0.9 + spk * 0.8) * uNight;
  col = mix(col, u_skyHor, smoothstep(180.0, 1100.0, length(cameraPosition - vW)));
  col = mix(col, col * vec3(0.28, 0.3, 0.55), uDusk);
  gl_FragColor = vec4(col, 1.0);
}` });
function axis(min, max, center, base, grow) {

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; shadowText(c.text, 0, big * 0.05, '#fff', 4);

}
function drawHUD() {
  const m = 14, h = clamp(H_ * 0.075, 38, 52), fs = h * 0.4, tn = tint();
  ctx.textBaseline = 'middle';
  if (state === 'title') {

    const t = `Best ${fmt(best)}`, w = ctx.measureText(t).width + 28;
    glass(m, m, w, h * 0.75, h * 0.375, tn); ctx.fillStyle = NAVY; ctx.fillText(t, m + 14, m + h * 0.375); return;
  }
  const dW = Math.max(130, fs * 7.2);

  ctx.textAlign = 'left'; ctx.font = fu(fs * 0.55, 600); ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.fillText('DISTANCE', m + h * 0.45, m + h * 0.3);
  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY; ctx.fillText(`${fmt(Math.floor(dist))} m`, m + h * 0.45, m + h * 0.66);
  // fever meter: three glossy dots fill with smooth landings

    g.addColorStop(0, '#fff'); g.addColorStop(0.4, rgba(mixC(col, WHITE, 0.3))); g.addColorStop(1, rgba(mixC(col, [0, 20, 60], 0.3)));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 8, 0, TAU); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  if (fever) { ctx.font = fd(fs * 0.8); ctx.textAlign = 'left'; shadowText('FEVER', m + 82, m + h + 17, rgba(pal.accent), 4); }
  if (state === 'play' || state === 'over') {
    const cap = lerp(80, 45, difficulty()), close = clamp(1 - (R.x - chaseX) / cap, 0, 1);
    const bx = m, by = m + h + 32, bw = Math.max(130, fs * 7.2), bh2 = 8;
    ctx.font = fu(fs * 0.5, 700); ctx.textAlign = 'left'; shadowText('WHITEWATER', bx + 2, by + 1, close > 0.6 && Math.floor(time * 6) % 2 ? '#ff8080' : '#fff', 4);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(bx, by + 8, bw, bh2, 4); ctx.fill();

  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY; ctx.fillText(fmt(score()), W - m - h * 0.45, m + h * 0.66);
  if (W > 760) {
    ctx.textAlign = 'center'; ctx.font = fu(fs * 0.6, 600);
    const zt = `Zone ${pal.zone + 1}  ·  ${pal.name}`, zw = ctx.measureText(zt).width + 30;
    glass(W / 2 - zw / 2, m + h * 0.15, zw, h * 0.7, h * 0.35, tn);

function drawLogo(x, y, size) {

  g.addColorStop(0, '#ffffff'); g.addColorStop(0.48, '#e4f6ff'); g.addColorStop(0.52, rgba(mixC(pal.accent, WHITE, 0.35))); g.addColorStop(1, rgba(pal.accent));
  ctx.save(); ctx.shadowColor = 'rgba(0,30,90,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 5; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.07; ctx.strokeStyle = '#ffffff'; ctx.strokeText('Aero', x, y); ctx.restore();

function drawTitle() {
  const compact = H_ < 520 && W > H_;

  const sub = 'SURF', tw = ctx.measureText(sub).width, sw = tw + Math.max(28, 64 * u), sh = Math.max(compact ? 24 : 30, 56 * u);
  ctx.font = fu(fs * 1.1, 700);

  const pw = compact ? Math.min(fs * 22, W * 0.44) : Math.min(W - 48, fs * 25), ph = fs * 1.8 * lines.length + fs * 1.2;
  const noteH = Math.max(14, 18 * u);

  const top = 60, avail = Math.max(80, H_ - top - 54), k = Math.min(1, avail / blockH);
  ctx.save();
  ctx.translate(Math.max(16, W * 0.05), top + Math.max(0, (avail - blockH * k) * (compact ? 0.5 : 0.25)));
  ctx.scale(k, k);
  drawLogo(0, y, size);
  ctx.font = subF;
  gem(size * 0.05, badgeY, sw, sh, pal.accent);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; shadowText(sub, size * 0.05 + (sw - tw) / 2, badgeY + sh * 0.53, '#fff', 3);
  let px, py, by;
  if (compact) { ctx.font = fd(size); px = ctx.measureText('Aero').width + size * 0.35; py = 0; by = badgeY + sh + fs * 1.2; }
  else { px = 0; py = badgeY + sh + fs * 1.4; by = py + ph + bh * 0.4; }

  lines.forEach(([a, b], i) => {
    const yy = py + fs * 1.5 + i * fs * 1.8;
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.font = fu(fs, 600); ctx.fillText(a, px + fs * 1.1, yy);
    ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.font = fu(fs, 700); ctx.fillText(b, px + pw - fs * 1.1, yy);
  });
  const bs = 1 + Math.sin(time * 4) * 0.03; ctx.font = fu(fs * 1.1, 700);
  ctx.save(); ctx.translate(bw / 2, by + bh / 2); ctx.scale(bs, bs); gem(-bw / 2, -bh / 2, bw, bh, [60, 200, 90]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; shadowText(bt, 0, 1, '#fff', 3); ctx.restore();
  ctx.font = fu(Math.max(11, 13 * u), 600); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const nx = compact ? px : 0, ny = compact ? py + ph + noteH * 0.9 : by + bh + noteH;
  shadowText(`Skin: ${SKINS[skinIdx].name}. Tap Skin or press K.`, nx, ny, '#fff', 6);
  shadowText(custom ? 'Custom surfer loaded. Press R to turn it.' : 'Meshy model? Drop a .glb or tap Load 3D model.', nx, ny + noteH * 1.2, '#fff', 6);
  ctx.restore();
}
function drawOver() {
  if (overT < 1.2) return;

  const pw = Math.min(W - 32, Math.max(320, fs * 24)), ph = fs * 20.5, px = (W - pw) / 2, py = (H_ - ph) / 2;
  const k = Math.min(1, (H_ - 16) / ph);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 30);
  ctx.translate(W / 2, H_ / 2); ctx.scale(k, k); ctx.translate(-W / 2, -H_ / 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = fd(fs * 2); shadowText('Wipeout!', W / 2, py + fs * 2.65, '#fff', 3);
  ctx.font = fu(fs, 600); ctx.fillStyle = NAVY; ctx.fillText(endReason, W / 2, py + fs * 5.6);
  const rows = [['Distance', `${fmt(Math.floor(dist))} m`], ['Score', fmt(score())], ['Smooth landings', String(smoothTotal)], ['Longest air', `${bestAir.toFixed(1)} s`], ['Best', fmt(best) + (newBest ? '  New best!' : '')]];
  rows.forEach(([kk, v], i) => {
    const yy = py + fs * 7.8 + i * fs * 1.9;
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(px + fs * 1.2, yy - fs * 0.8, pw - fs * 2.4, fs * 1.6, fs * 0.8); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.font = fu(fs, 600); ctx.fillText(kk, px + fs * 2, yy);

  });

function drawUI() {

/* ───────────────────────── input ───────────────────────── */
function press() {
  initAudio();
  if (paused) { paused = false; return false; }
  if (state === 'title') { startGame(); return false; }
  if (state === 'over') { if (overT > 2) startGame(); return false; }
  return true;
}
const ptrs = new Map(), keysDown = new Map();
function syncInput() { let n = 0, sd = 0; for (const v of ptrs.values()) { n++; sd += v; } for (const v of keysDown.values()) { n++; sd += v; } input.held = n > 0; input.side = clamp(sd, -1, 1); }
const release = () => { ptrs.clear(); keysDown.clear(); syncInput(); };
const fileIn = document.getElementById('file');
for (const id of ['mute', 'model', 'skin']) document.getElementById(id).addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('skin').addEventListener('click', e => { e.stopPropagation(); applySkin(skinIdx + 1, true); e.currentTarget.blur(); });
applySkin(skinIdx, false);
const nightBtn = document.getElementById('night');
function setNight(on, announce) {
  nightMode = on; nightBtn.textContent = on ? 'Day mode' : 'Night mode'; nightBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('aero-surf-night', on ? '1' : '0'); } catch (e) { }
  if (announce) callout(on ? 'Night mode' : 'Day mode', on ? 'Moon, stars and glowing water' : 'Sunshine and rainbows', 1.4);
}
nightBtn.addEventListener('pointerdown', e => e.stopPropagation());
nightBtn.addEventListener('click', e => { e.stopPropagation(); setNight(!nightMode, true); nightBtn.blur(); });
setNight(nightMode, false);
const fullBtn = document.getElementById('full');
if (document.fullscreenEnabled && document.documentElement.requestFullscreen) fullBtn.hidden = false;
fullBtn.addEventListener('pointerdown', e => e.stopPropagation());
fullBtn.addEventListener('click', e => {
  e.stopPropagation(); fullBtn.blur();
  const req = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({ navigationUI: 'hide' });
  if (req && req.catch) req.catch(() => { fullBtn.hidden = true; });
});
document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; setTimeout(resize, 60); });
document.getElementById('mute').addEventListener('click', e => { e.stopPropagation(); initAudio(); setMute(!AU.on); e.currentTarget.blur(); });
document.getElementById('model').addEventListener('click', e => { e.stopPropagation(); fileIn.click(); e.currentTarget.blur(); });
fileIn.addEventListener('change', () => { loadFile(fileIn.files[0]); fileIn.value = ''; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#controls')) return; e.preventDefault(); if (press()) { ptrs.set(e.pointerId, e.clientX > W / 2 ? 1 : -1); syncInput(); } });

for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { ptrs.delete(e.pointerId); syncInput(); });
window.addEventListener('blur', () => { release(); if (state === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
const KEY_SIDE = { Space: 0, ArrowDown: 0, ArrowUp: 0, KeyS: 0, KeyW: 0, KeyZ: 0, KeyX: 0, Enter: 0, ArrowRight: 1, KeyD: 1, ArrowLeft: -1, KeyA: -1 };
window.addEventListener('keydown', e => {
  if (e.code in KEY_SIDE) { e.preventDefault(); if (!e.repeat && press()) { keysDown.set(e.code, KEY_SIDE[e.code]); syncInput(); } }
  else if (e.code === 'KeyM') { initAudio(); setMute(!AU.on); }
  else if (e.code === 'KeyR' && custom) modelYaw += Math.PI / 2;
  else if (e.code === 'KeyK') applySkin(skinIdx + 1, true);
  else if (e.code === 'KeyN') setNight(!nightMode, true);
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;

window.addEventListener('keyup', e => { if (keysDown.delete(e.code)) syncInput(); });

/* ───────────────────────── loop ───────────────────────── */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (!paused) update(dt);
  renderer.render(scene, camera); drawUI();

}
function boot(data) {

}
// test hook: fast-forward the simulation without rendering
