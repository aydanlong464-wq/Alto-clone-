<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Descent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one full-bleed canvas; floating glass pills for HUD. Single bright Frutiger Aero look by design. */
:root {
  --sky: #2f9bff;
  --navy: #0d3b66;
  --glass: rgba(255, 255, 255, 0.72);
  --glass-low: rgba(191, 230, 255, 0.6);
  --aqua: #29b6ff;
  --font-display: "Nunito", "Segoe UI", "Arial Rounded MT Bold", sans-serif;
  --font-ui: "Open Sans", "Segoe UI", Frutiger, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  background: var(--sky);
}
html, body { height: 100%; margin: 0; background: var(--sky); color: var(--navy); overflow: hidden; }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#game { display: block; width: 100%; height: 100%; cursor: pointer; }
#mute {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  right: max(12px, env(safe-area-inset-right, 0px));
  font: 700 12px/1 var(--font-ui);
  color: var(--navy);
  background: linear-gradient(180deg, var(--glass) 0%, var(--glass) 48%, var(--glass-low) 52%, var(--glass-low) 100%);
  border: 1px solid #fff;
  border-radius: 999px;
  padding: 8px 14px;
  box-shadow: 0 2px 8px rgba(0, 50, 110, 0.25), inset 0 1px 0 #fff;
  cursor: pointer;
}
#mute:hover { filter: brightness(1.06); }
#mute:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Aero Descent. Press space or tap to jump, hold in the air to backflip."></canvas>
<button id="mute" type="button" aria-pressed="false">Sound on</button>

<script>
(() => {
'use strict';

/* ───────────────────────── utilities ───────────────────────── */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => Math.random() < p;
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const smooth = t => t * t * (3 - 2 * t);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function hash(i, s) {
  let h = Math.imul((i | 0) ^ Math.imul(s | 0, 0x9E3779B1), 0x85EBCA6B);
  h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function snoise(x, s) { const i = Math.floor(x); return lerp(hash(i, s), hash(i + 1, s), smooth(x - i)); }
function hills(x, s) { return (snoise(x, s) * 0.7 + snoise(x * 2.3, s + 51) * 0.3); }
function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WHITE = [255, 255, 255];

/* ───────────────────────── palettes ───────────────────────── */
const PAL_DEF = [
  { name: 'Meadow', root: 130.8, night: 0, skyTop: '#0a5bd6', skyMid: '#2f9bff', skyHor: '#c4ecff', sun: '#ffffff', cloud: '#ffffff', sea: '#57c8ff', seaDeep: '#0a6fd1', h0: '#9fd3ee', h1: '#6cc97a', h2: '#36a845', grassHi: '#f2ffe0', grass: '#74d63f', grassDeep: '#2c9a3a', soil: '#145c3a', accent: '#1aa7ff', bubble: '#8fe3ff' },
  { name: 'Lagoon', root: 146.8, night: 0, skyTop: '#0067b0', skyMid: '#19c2e6', skyHor: '#d6fbff', sun: '#ffffff', cloud: '#ffffff', sea: '#3fe0e0', seaDeep: '#008fb0', h0: '#a6e6e6', h1: '#4fd1b5', h2: '#12a88f', grassHi: '#eafff8', grass: '#3fdcb0', grassDeep: '#0f9a85', soil: '#075a5a', accent: '#00b8d4', bubble: '#a8fff5' },
  { name: 'Sunset Gloss', root: 164.8, night: 0, skyTop: '#3a3fd1', skyMid: '#ff6fa8', skyHor: '#ffd59a', sun: '#fff6d8', cloud: '#ffe6f1', sea: '#ff9fb8', seaDeep: '#6a4ad6', h0: '#e9a6d0', h1: '#b77ad6', h2: '#7a4fc9', grassHi: '#fff0fa', grass: '#c47ae6', grassDeep: '#6b3fb8', soil: '#2d1f6e', accent: '#ff4f9a', bubble: '#ffd0ec' },
  { name: 'Aurora', root: 110.0, night: 1, skyTop: '#020b2e', skyMid: '#0b2a7a', skyHor: '#1f7fd1', sun: '#e8fbff', cloud: '#9ec9ff', sea: '#1a5fb8', seaDeep: '#041a52', h0: '#2a4f9e', h1: '#13497a', h2: '#0b3a5e', grassHi: '#c9fff0', grass: '#23c9a0', grassDeep: '#0a6e6a', soil: '#032a3a', accent: '#19d99a', bubble: '#7dfff0' },
  { name: 'Citrus', root: 174.6, night: 0, skyTop: '#0a7ad6', skyMid: '#4fc3ff', skyHor: '#f4ffd0', sun: '#ffffff', cloud: '#ffffff', sea: '#7fe0ff', seaDeep: '#1494d6', h0: '#c6ef9a', h1: '#9ee03a', h2: '#5fbf1a', grassHi: '#fbffe0', grass: '#b6ef2a', grassDeep: '#5aa812', soil: '#2e6a0c', accent: '#62b800', bubble: '#e8ff9a' },
];
const CKEYS = ['skyTop', 'skyMid', 'skyHor', 'sun', 'cloud', 'sea', 'seaDeep', 'h0', 'h1', 'h2', 'grassHi', 'grass', 'grassDeep', 'soil', 'accent', 'bubble'];
const PALS = PAL_DEF.map(p => { const o = { name: p.name, root: p.root, night: p.night }; CKEYS.forEach(k => o[k] = hex(p[k])); return o; });
const pal = { name: 'Meadow', root: 130.8, night: 0, zone: 0, c: { white: '#ffffff' } };
CKEYS.forEach(k => { pal[k] = PALS[0][k].slice(); pal.c[k] = rgba(pal[k]); });

/* ───────────────────────── canvas ───────────────────────── */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, VIEW = 1, UI = 1, vignette = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  VIEW = Math.min(H / 760, W / 1000);
  UI = Math.min(W / 1100, H / 700);
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  vignette.addColorStop(0, 'rgba(0,30,80,0)');
  vignette.addColorStop(1, 'rgba(0,30,80,0.28)');
}
window.addEventListener('resize', resize);

function rr(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
// glossy glass panel: light top half, tinted bottom, white rim, soft drop shadow
function glass(x, y, w, h, r, tint, strong) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,50,110,0.28)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3;
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, `rgba(255,255,255,${strong ? 0.92 : 0.7})`);
  g.addColorStop(0.49, `rgba(255,255,255,${strong ? 0.75 : 0.45})`);
  g.addColorStop(0.51, rgba(tint, strong ? 0.6 : 0.35));
  g.addColorStop(1, rgba(mixC(tint, WHITE, 0.4), strong ? 0.8 : 0.55));
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r);
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.2; ctx.stroke();
}
// glossy button / badge pill in a solid color
function gem(x, y, w, h, col) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,40,100,0.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  rr(x, y, w, h, h / 2);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, rgba(mixC(col, WHITE, 0.45))); g.addColorStop(0.5, rgba(col)); g.addColorStop(1, rgba(mixC(col, [0, 30, 80], 0.25)));
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  rr(x + h * 0.18, y + h * 0.07, w - h * 0.36, h * 0.42, h * 0.21);
  const hl = ctx.createLinearGradient(0, y, 0, y + h * 0.5);
  hl.addColorStop(0, 'rgba(255,255,255,0.85)'); hl.addColorStop(1, 'rgba(255,255,255,0.1)');
  ctx.fillStyle = hl; ctx.fill();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, h / 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.2; ctx.stroke();
}

/* ───────────────────────── audio ───────────────────────── */
const AU = { ctx: null, on: true };
function initAudio() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    const c = new AC(); AU.ctx = c;
    AU.master = c.createGain(); AU.master.gain.value = AU.on ? 0.7 : 0; AU.master.connect(c.destination);
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = nb;
    const loopNoise = (type, f, q) => {
      const s = c.createBufferSource(); s.buffer = nb; s.loop = true;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = c.createGain(); g.gain.value = 0;
      s.connect(fl); fl.connect(g); g.connect(AU.master); s.start();
      return { f: fl, g };
    };
    AU.wind = loopNoise('bandpass', 500, 0.6);
    AU.carve = loopNoise('highpass', 3200, 0.5);
    // soft major pad
    AU.padLP = c.createBiquadFilter(); AU.padLP.type = 'lowpass'; AU.padLP.frequency.value = 1600;
    AU.padG = c.createGain(); AU.padG.gain.value = 0.035;
    AU.padLP.connect(AU.padG); AU.padG.connect(AU.master);
    AU.pad = [[1, 'triangle'], [1.26, 'sine'], [1.5, 'sine'], [0.5, 'sine']].map(([m, type]) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = pal.root * m; o.connect(AU.padLP); o.start(); o.mult = m; return o;
    });
    const lfo = c.createOscillator(); lfo.frequency.value = 0.15; const lg = c.createGain(); lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(AU.padG.gain); lfo.start();
    // grind hum
    const go = c.createOscillator(); go.type = 'triangle'; go.frequency.value = 330;
    AU.grindG = c.createGain(); AU.grindG.gain.value = 0;
    go.connect(AU.grindG); AU.grindG.connect(AU.master); go.start();
  } catch (e) { AU.ctx = null; }
}
function setMute(on) {
  AU.on = on;
  const b = document.getElementById('mute');
  b.textContent = on ? 'Sound on' : 'Sound off';
  b.setAttribute('aria-pressed', on ? 'false' : 'true');
  if (AU.master) AU.master.gain.setTargetAtTime(on ? 0.7 : 0, AU.ctx.currentTime, 0.05);
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (!AU.ctx || !AU.on) return;
  const c = AU.ctx, t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + 0.02);
}
function hit(dur, vol, f, type = 'lowpass') {
  if (!AU.ctx || !AU.on) return;
  const c = AU.ctx, t = c.currentTime;
  const s = c.createBufferSource(); s.buffer = AU.noise;
  const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f;
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const note = st => pal.root * 4 * Math.pow(2, st / 12);
const sfx = {
  jump() { hit(0.16, 0.18, 2400, 'highpass'); tone(note(0) / 2, 0.14, 'sine', 0.1, note(7) / 2); },
  land(f) { tone(140, 0.2, 'sine', 0.18 * f + 0.06, 70); hit(0.1, 0.1 * f + 0.04, 900); },
  coin(n) { const st = SCALE[n % SCALE.length]; tone(note(st), 0.22, 'sine', 0.09); tone(note(st) * 2, 0.12, 'triangle', 0.03); },
  flip(n) { for (let i = 0; i < Math.min(n, 3) + 2; i++) tone(note(SCALE[i * 2]), 0.32, 'triangle', 0.06, 0, i * 0.07); },
  crash() { tone(420, 0.5, 'sine', 0.2, 90); hit(0.4, 0.25, 700); tone(note(4) / 2, 0.6, 'triangle', 0.05, note(0) / 4, 0.1); },
  zone() { [0, 4, 7, 12].forEach((s, i) => tone(note(s), 1.2, 'sine', 0.05, 0, i * 0.09)); },
  wire() { tone(note(12), 0.12, 'sine', 0.06); },
};
function updateAudio() {
  if (!AU.ctx) return;
  const t = AU.ctx.currentTime;
  const sp = clamp(R.speed / 1400, 0, 1);
  const alive = state !== 'dead';
  AU.wind.g.gain.setTargetAtTime(alive ? (R.mode === 'air' ? 0.16 : 0.07) * (0.3 + sp) : 0.02, t, 0.1);
  AU.wind.f.frequency.setTargetAtTime(300 + R.speed * 0.9, t, 0.2);
  AU.carve.g.gain.setTargetAtTime(alive && R.mode === 'ground' ? 0.025 + sp * 0.05 : 0, t, 0.05);
  AU.grindG.gain.setTargetAtTime(alive && R.mode === 'grind' ? 0.025 : 0, t, 0.03);
  AU.pad.forEach(o => o.frequency.setTargetAtTime(pal.root * o.mult, t, 0.8));
  AU.padLP.frequency.setTargetAtTime(state === 'dead' ? 500 : 1200 + sp * 1200, t, 0.4);
}

/* ───────────────────────── terrain ───────────────────────── */
const DX = 20;
const T = { base: 0, ys: [0], gy: 0, slope: 0, seg: null, queue: [], gaps: [], safe: false, lastPlan: '' };
let rocks = [], poles = [], wires = [], coins = [], trees = [];

const Sg = (n, target, ease, extra) => Object.assign({ n, target, ease }, extra || {});
const lastX = () => (T.base + T.ys.length - 1) * DX;

function groundAt(x) {
  let f = x / DX - T.base, i = Math.floor(f);
  if (i < 0) return T.ys[0];
  if (i >= T.ys.length - 1) return T.ys[T.ys.length - 1];
  return T.ys[i] + (T.ys[i + 1] - T.ys[i]) * (f - i);
}
function slopeAt(x) {
  const i = clamp(Math.floor(x / DX - T.base), 0, T.ys.length - 2);
  return (T.ys[i + 1] - T.ys[i]) / DX;
}
function gapAt(x) { for (const g of T.gaps) if (x > g.x1 && x < g.x2) return g; return null; }

function genPoint() {
  if (!T.seg || T.seg.left <= 0) {
    if (T.seg && T.seg.after) T.seg.after(T.seg.x0, lastX(), T.seg);
    if (!T.queue.length) plan();
    T.seg = T.queue.shift(); T.seg.left = T.seg.n; T.seg.x0 = lastX() + DX; T.seg.y0 = T.gy;
  }
  const s = T.seg;
  T.slope += (s.target - T.slope) * s.ease;
  T.gy += T.slope * DX;
  T.ys.push(T.gy); s.left--;
}
function ensureTerrain(x) { while (lastX() < x) genPoint(); }
function pruneWorld(x) {
  const k = Math.floor(x / DX) - T.base;
  if (k > 300) { T.ys.splice(0, k); T.base += k; }
  const keep = o => (o.x2 !== undefined ? o.x2 : o.x) > x - 200;
  T.gaps = T.gaps.filter(keep); rocks = rocks.filter(keep); poles = poles.filter(keep);
  wires = wires.filter(keep); coins = coins.filter(keep); trees = trees.filter(keep);
}

const difficulty = () => clamp(distM / 4500, 0, 1);

const PLANS = {
  roll() {
    const t = chance(0.25) ? rand(-0.12, 0.06) : rand(0.2, 0.6);
    T.queue.push(Sg(randi(18, 40), t, rand(0.04, 0.09), { after: decorate }));
  },
  rocks() { T.queue.push(Sg(randi(36, 50), rand(0.22, 0.42), 0.08, { after: placeRocks })); },
  cliff() {
    T.queue.push(Sg(randi(16, 24), 0.5, 0.08));
    T.queue.push(Sg(randi(6, 10), rand(1.6, 2.4), 0.55));
    T.queue.push(Sg(26, 0.45, 0.12, { after: decorate }));
  },
  kick() {
    T.queue.push(Sg(14, 0.65, 0.1));
    T.queue.push(Sg(7, rand(-0.45, -0.65), 0.35));
    T.queue.push(Sg(12, 1.1, 0.4));
    T.queue.push(Sg(22, 0.45, 0.1, { after: decorate }));
  },
  gap() {
    const d = difficulty();
    T.queue.push(Sg(16, 0.7, 0.1));
    T.queue.push(Sg(7, -0.5 - 0.15 * d, 0.35));
    T.queue.push(Sg(randi(6, 8 + Math.round(d * 5)), 1.5, 0.7, { after: gapAfter }));
    T.queue.push(Sg(24, 0.75, 0.12));
  },
  wires() { T.queue.push(Sg(randi(54, 72), rand(0.28, 0.4), 0.07, { after: placeWires })); },
};
function plan() {
  if (T.safe) {
    const r = Math.random();
    (r < 0.4 ? PLANS.roll : r < 0.7 ? PLANS.cliff : PLANS.kick)();
    return;
  }
  const d = difficulty();
  let opts = [['roll', 2.5], ['rocks', 2 + 2 * d], ['gap', 1.4 + 2.6 * d], ['kick', 1.6], ['cliff', 1.6], ['wires', 1.8]];
  if (distM < 60) opts = [['roll', 1], ['kick', 1]];
  opts = opts.filter(o => o[0] !== T.lastPlan || o[0] === 'roll');
  let sum = opts.reduce((a, o) => a + o[1], 0), r = Math.random() * sum, pick = opts[0][0];
  for (const o of opts) { r -= o[1]; if (r <= 0) { pick = o[0]; break; } }
  T.lastPlan = pick; PLANS[pick]();
}

function decorate(x0, x1) {
  if (chance(0.6)) {
    const n = randi(1, 2);
    for (let i = 0; i < n; i++) { const x = rand(x0 + 40, x1 - 40); trees.push(makeTree(x, groundAt(x) + 6)); }
  }
  if (!T.safe && chance(0.45) && x1 - x0 > 420) {
    let cx = rand(x0 + 60, x1 - 380);
    for (let i = 0; i < 7; i++, cx += 46) coins.push({ x: cx, y: groundAt(cx) - 38, t: Math.random() * 6 });
  }
}
function placeRocks(x0, x1) {
  const d = difficulty();
  let x = x0 + rand(140, 220);
  const count = 1 + (chance(0.35 + 0.4 * d) ? 1 : 0) + (d > 0.5 && chance(0.4) ? 1 : 0);
  for (let i = 0; i < count && x < x1 - 120; i++) {
    rocks.push(makeRock(x, groundAt(x), Math.atan(slopeAt(x))));
    if (chance(0.5)) coins.push({ x, y: groundAt(x) - 120, t: 0 });
    x += rand(320, 520);
  }
}
function gapAfter(x0, x1) {
  const g = { x1: x0 - DX, x2: x1, bottom: groundAt(x1) + 520 };
  T.gaps.push(g);
  if (chance(0.65)) {
    const ly = groundAt(g.x1), ry = groundAt(g.x2), end = g.x2 + 60;
    for (let cx = g.x1 + 30; cx < end; cx += 44) {
      const t = (cx - g.x1) / (end - g.x1);
      coins.push({ x: cx, y: lerp(ly, ry, t) - 60 - 200 * 4 * t * (1 - t), t: t * 4 });
    }
  }
}
const POLE_H = 128, WIRE_H = 112, SAG = 22;
function placeWires(x0, x1) {
  const xs = [];
  for (let x = x0 + 80; x < x1 - 60; x += rand(280, 340)) xs.push(x);
  if (xs.length < 2) return;
  xs.forEach(x => poles.push({ x, y: groundAt(x) }));
  for (let i = 0; i < xs.length - 1; i++) {
    const w = { x1: xs[i], y1: groundAt(xs[i]) - WIRE_H, x2: xs[i + 1], y2: groundAt(xs[i + 1]) - WIRE_H, sag: SAG };
    w.x = w.x2; wires.push(w);

/* ───────────────────────── rider ───────────────────────── */
const G = 1500, DRAG = 0.0007, FRIC = 25, JUMP = 580, ROT = 7.4, TOL = 0.85, MAXS = 1350;

const R = { x: 0, y: 0, vx: 0, vy: 0, speed: 0, ang: 0, angVel: 0, mode: 'ground', rot: 0, airT: 0, coyote: 0, jumped: false, wire: null, squash: 0, crouch: 0.3, lastTh: 0 };

let state = 'title', paused = false;
let distM = 0, trickScore = 0, combo = 1, comboT = 0, best = 0, runFlips = 0, coinStreak = 0;
let boostT = 0, deadT = 0, deathReason = '', time = 0, playT = 0, timeScale = 1, slowT = 0;
let shake = 0, flashA = 0, flashC = [255, 255, 255], newBest = false;
const cam = { x: 0, y: 0, z: 1, look: 0 };
let bgY = 0, camOX = 0.62;
let particles = [], callouts = [];
const input = { held: false, queued: false };

try { best = +localStorage.getItem('aero-descent-best') || 0; } catch (e) { }

function minSpeed() { return 300 + 230 * difficulty(); }

function resetWorld(safe) {

  T.queue.push(Sg(150, 0.12, 0.05), Sg(40, 0.4, 0.05, { after: decorate }));

  distM = 0; trickScore = 0; combo = 1; comboT = 0; runFlips = 0; boostT = 0; coinStreak = 0; newBest = false;
  ensureTerrain(4000);
  Object.assign(R, { x: 80, y: groundAt(80), vx: 380, vy: 0, speed: 380, ang: Math.atan(slopeAt(80)), angVel: 0, mode: 'ground', rot: 0, airT: 0, coyote: 0, jumped: false, wire: null, squash: 0 });
  cam.x = R.x; cam.y = R.y - 70; cam.z = 1; cam.look = 0; bgY = cam.y;
}
function startGame() {

}

function flash(c, a) { flashC = c; flashA = Math.max(flashA, a); }
function callout(text, sub, life = 1.1) {

}
function addTrick(pts, text, sub) {

}

function goAir(vx, vy) {

}
function tryJump() {
  let th;

}

function crash(reason) {

  slowT = 1.1; shake = 14; flash(WHITE, 0.7);
  sfx.crash();
  for (let i = 0; i < 22; i++) {
    const a = rand(0, TAU), s = rand(80, 480);
    particles.push({ x: R.x + rand(-10, 10), y: R.y - rand(0, 40), vx: R.vx * 0.45 + Math.cos(a) * s, vy: R.vy * 0.3 + Math.sin(a) * s - 200, life: rand(1.4, 2.6), max: 2.6, size: rand(4, 10), col: 'green', type: 'orb', g: 1 });

}

}

function land(gy) {

  R.ang = th; R.angVel = 0;
  if (air > 0.22) {
    R.squash = 0.35 + impact * 0.4;
    sfx.land(impact);
    for (let i = 0; i < 10 + impact * 18; i++) spawnP(R.x + rand(-20, 20), R.y, rand(-260, 260) + R.vx * 0.2, rand(-260, -40), rand(0.3, 0.7), rand(2, 5), chance(0.5) ? 'grassHi' : 'grass');
    if (!demo) {
      if (flips > 0) {
        runFlips += flips;
        const names = ['', 'Backflip!', 'Double Backflip!', 'Triple Backflip!'];
        addTrick(200 * flips * flips, names[flips] || `${flips}× Backflip!`);
        R.speed += 130 * flips; boostT = 1.3; sfx.flip(flips);
        flash(WHITE, 0.25);
        for (let i = 0; i < 10; i++) spawnP(R.x + rand(-30, 30), R.y - rand(10, 60), rand(-60, 60), rand(-140, -40), rand(0.6, 1.1), rand(5, 11), 'bubble', 'bubble', -0.05);
      }
      if (Math.abs(d) < 0.16 && air > 0.45) { addTrick(100, 'Perfect!'); R.speed += 60; boostT = Math.max(boostT, 0.6); }

}

function step(dt) {

  const demo = state === 'title';
  if (R.mode === 'dead') return;

  if (input.queued) { input.queued = false; if (!demo) tryJump(); }
  let hold = input.held;
  if (demo) {
    const h = groundAt(R.x) - R.y;
    hold = R.mode === 'air' && h > 150 && -R.rot < TAU - 0.9;
    if (R.mode === 'ground' && slopeAt(R.x) < -0.35 && chance(0.02)) tryJump();

      }

        else { R.x = nx; R.y = gy; }

        const c = Math.cos(R.ang), sn = Math.sin(R.ang);

/* ───────────────────────── per-frame update ───────────────────────── */
const bubbles = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), r: rand(3, 13), z: rand(0.4, 1), w: rand(0, TAU) }));
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.55, s: rand(0.6, 1.8), p: rand(0, TAU) }));
const clouds = Array.from({ length: 12 }, (_, i) => {
  const blobs = [];
  const n = randi(5, 7);
  for (let k = 0; k < n; k++) { const t = k / (n - 1); blobs.push([lerp(-1, 1, t) * rand(0.9, 1.1), -Math.sin(t * Math.PI) * rand(0.35, 0.65), rand(0.35, 0.55) * (0.6 + Math.sin(t * Math.PI) * 0.6)]); }
  return { u: Math.random(), y: rand(0.06, 0.4), s: rand(0.6, 1.3), par: [0.015, 0.03, 0.05][i % 3], blobs };
}).sort((a, b) => a.par - b.par);
let lastZone = 0;

function updatePalette() {
  const ZONE_M = 1000;
  const zf = (state === 'title' ? time * 30 : distM) / ZONE_M;
  const zi = Math.floor(zf), f = zf - zi;
  const t = smooth(clamp((f - 0.85) / 0.15, 0, 1));
  const A = PALS[zi % PALS.length], B = PALS[(zi + 1) % PALS.length];
  CKEYS.forEach(k => { pal[k] = mixC(A[k], B[k], t); pal.c[k] = rgba(pal[k]); });
  pal.root = lerp(A.root, B.root, t);
  pal.night = lerp(A.night, B.night, t);
  pal.name = A.name; pal.zone = zi;
  if (state === 'play' && zi !== lastZone && zi > 0) {
    callout(`Zone ${zi + 1}: ${A.name}`, `${zi * ZONE_M} m`, 2);
    sfx.zone();
  }
  lastZone = zi;
}

let acc = 0;
function update(dt) {
  time += dt;
  if (slowT > 0) { slowT -= dt; timeScale = 0.28; } else timeScale = 1;
  const sdt = dt * timeScale;
  if (state === 'play') playT += dt;
  if (state === 'dead') deadT += dt;

  if (state !== 'dead') {
    acc += sdt;
    let n = 0;
    while (acc >= STEP && n < 12) { step(STEP); acc -= STEP; n++; }
    if (n >= 12) acc = 0;
  }

  if (R.mode === 'ground') { comboT -= dt; if (comboT <= 0 && combo > 1) combo = 1; if (comboT <= 0) coinStreak = 0; }
  boostT -= dt;
  R.squash *= Math.exp(-8 * dt);
  const crouchT = R.mode === 'air' ? Math.min(0.9, 0.25 + Math.abs(R.angVel) / 9) : 0.28 + Math.max(0, R.squash);
  R.crouch += (clamp(crouchT, 0, 1) - R.crouch) * Math.min(1, dt * 14);

  if (state !== 'dead') {
    const hAir = R.mode === 'air' ? Math.max(0, groundAt(R.x + 120) - R.y) : 0;
    const zT = clamp(1 - Math.max(0, R.speed - 450) / 2600 - hAir / 1700, 0.6, 1);
    cam.z += (zT - cam.z) * Math.min(1, dt * 1.6);
    cam.look += (R.vx * 0.2 - cam.look) * Math.min(1, dt * 2);
    cam.x = R.x + cam.look;
    cam.y += (R.y - 70 + Math.min(hAir * 0.45, 420) - cam.y) * Math.min(1, dt * 5);
  } else {
    cam.x += 60 * dt;
  }
  bgY += (cam.y - bgY) * Math.min(1, dt * 0.35);
  camOX += ((state === 'title' ? (W > H ? 0.62 : 0.7) : 0.36) - camOX) * Math.min(1, dt * 2.5);
  pruneWorld(cam.x - 1400);

  for (const p of particles) {
    p.life -= sdt; p.vy += G * p.g * sdt; p.x += p.vx * sdt; p.y += p.vy * sdt;
    if (p.type === 'orb') { const gy = groundAt(p.x); if (p.y > gy - p.size && !gapAt(p.x)) { p.y = gy - p.size; p.vy *= -0.45; p.vx *= 0.7; } }
  }
  particles = particles.filter(p => p.life > 0);
  for (const c of callouts) c.age += dt;
  callouts = callouts.filter(c => c.age < c.life);
  for (const c of coins) c.t += dt;

  const drift = (R.vx || 0) * 0.00011 + 0.01;
  for (const b of bubbles) {
    b.x -= drift * b.z * dt * 6; b.y -= (0.025 + 0.03 * b.z) * dt; b.w += dt * 2;
    if (b.x < -0.05) { b.x = 1.05; b.y = Math.random(); }
    if (b.y < -0.05) { b.y = 1.05; b.x = Math.random(); }
  }

  updateAudio();
}

/* ───────────────────────── render: backdrop ───────────────────────── */
let S = 1, OX = 0, OY = 0;
function setWorld() {
  S = VIEW * cam.z; OX = W * camOX; OY = H * (H > W ? 0.6 : 0.5);
  const k = REDUCED ? 0 : shake;
  const sx = rand(-k, k), sy = rand(-k, k);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX - cam.x * S + sx), DPR * (OY - cam.y * S + sy));
}
const setScreen = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const HOR = 0.62;

function sunPos() { return [W * 0.78, H * 0.2, Math.min(W, H) * 0.075]; }

function drawSky() {
  const c = pal.c, hor = H * HOR;
  const g = ctx.createLinearGradient(0, 0, 0, hor);
  g.addColorStop(0, c.skyTop); g.addColorStop(0.5, c.skyMid); g.addColorStop(1, c.skyHor);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hor + 1);

  if (pal.night > 0.02) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = pal.night * (0.5 + 0.5 * Math.sin(time * 2 + s.p));
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    // aurora ribbons
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const base = H * (0.14 + k * 0.07);
      for (let x = 0; x <= W; x += 16) {
        const y = base + Math.sin(x * 0.006 + time * 0.4 + k * 2) * H * 0.05 + Math.sin(x * 0.017 + time * 0.7) * H * 0.015;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.lineTo(W, base + H * 0.22); ctx.lineTo(0, base + H * 0.22); ctx.closePath();
      const ag = ctx.createLinearGradient(0, base - H * 0.05, 0, base + H * 0.22);
      ag.addColorStop(0, rgba(pal.accent, 0)); ag.addColorStop(0.2, rgba(pal.accent, 0.22 * pal.night)); ag.addColorStop(1, rgba(pal.bubble, 0));
      ctx.fillStyle = ag; ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  // sun with bloom and soft rays
  const [sx, sy, r] = sunPos();
  ctx.globalCompositeOperation = 'lighter';
  const L = Math.hypot(W, H);
  for (let i = 0; i < 12; i++) {
    const a = time * 0.04 + i * TAU / 12, w = 0.035 + 0.02 * Math.sin(i * 2.3);
    const rg = ctx.createRadialGradient(sx, sy, r, sx, sy, L * 0.7);
    rg.addColorStop(0, rgba(pal.sun, 0.12)); rg.addColorStop(1, rgba(pal.sun, 0));
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(a - w) * L, sy + Math.sin(a - w) * L);
    ctx.lineTo(sx + Math.cos(a + w) * L, sy + Math.sin(a + w) * L); ctx.fill();
  }
  const bloom = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 5);
  bloom.addColorStop(0, rgba(pal.sun, 0.9)); bloom.addColorStop(0.2, rgba(pal.sun, 0.45)); bloom.addColorStop(1, rgba(pal.sun, 0));
  ctx.fillStyle = bloom; ctx.fillRect(sx - r * 5, sy - r * 5, r * 10, r * 10);
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fillStyle = c.sun; ctx.fill();
}

function drawClouds() {
  const span = W + 700;
  const scale = Math.max(0.6, Math.min(W, H) / 720) * 70;
  for (const cl of clouds) {
    const x = (((cl.u * span - cam.x * VIEW * cl.par) % span) + span) % span - 350;
    const y = cl.y * H, s = cl.s * scale * (0.7 + cl.par * 8);
    const top = y - s * 1.1, bot = y + s * 0.5;
    const g = ctx.createLinearGradient(0, top, 0, bot);
    const shade = mixC(pal.cloud, pal.skyMid, 0.35);
    g.addColorStop(0, rgba(pal.cloud)); g.addColorStop(0.6, rgba(pal.cloud)); g.addColorStop(1, rgba(shade));
    ctx.globalAlpha = (0.95 - pal.night * 0.6) * (0.75 + cl.par * 5);
    ctx.fillStyle = g;
    ctx.beginPath();
    for (const [bx, by, br] of cl.blobs) { ctx.moveTo(x + bx * s + br * s, y + by * s); ctx.arc(x + bx * s, y + by * s, br * s, 0, TAU); }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawSea() {
  const y0 = H * (HOR - 0.03) - clamp((cam.y - bgY) * S * 0.04, -H * 0.04, H * 0.04);
  const g = ctx.createLinearGradient(0, y0, 0, H);
  g.addColorStop(0, pal.c.sea); g.addColorStop(0.5, pal.c.seaDeep); g.addColorStop(1, pal.c.seaDeep);
  ctx.fillStyle = g; ctx.fillRect(0, y0, W, H - y0);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(0, y0, W, 1.5);
  // glints
  for (let i = 0; i < 40; i++) {
    const a = 0.5 + 0.5 * Math.sin(time * 2.2 + i * 7.1);
    if (a < 0.55) continue;
    const x = ((hash(i, 3) * W * 1.3 - cam.x * VIEW * 0.02) % W + W) % W;
    const y = y0 + 4 + hash(i, 5) * H * 0.12;
    ctx.globalAlpha = a * 0.8;
    ctx.fillRect(x, y, 6 + hash(i, 9) * 18, 1.5);
  }
  ctx.globalAlpha = 1;
}

const LAYERS = [
  { par: 0.05, base: 0.68, amp: 0.16, freq: 1 / 520, seed: 11, key: 'h0', haze: 0.45 },
  { par: 0.13, base: 0.78, amp: 0.2, freq: 1 / 340, seed: 23, key: 'h1', haze: 0.15, turbines: true },
  { par: 0.27, base: 0.9, amp: 0.2, freq: 1 / 230, seed: 37, key: 'h2', haze: 0 },
];
function layerY(L, u, oy) { return H * L.base - hills(u * L.freq, L.seed) * H * L.amp + oy; }
function drawTurbine(x, y, h, i) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(180,200,220,0.9)'; ctx.lineWidth = Math.max(2, h * 0.045);
  ctx.beginPath(); ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y - h); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.4, h * 0.03);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.stroke();
  const a0 = time * 1.4 + i * 1.7, bl = h * 0.55;
  ctx.fillStyle = '#ffffff';
  for (let k = 0; k < 3; k++) {
    const a = a0 + k * TAU / 3, ca = Math.cos(a), sa = Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(x - sa * 2, y - h + ca * 2);
    ctx.lineTo(x + ca * bl, y - h + sa * bl);
    ctx.lineTo(x + sa * 2.5, y - h - ca * 2.5);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y - h, Math.max(2, h * 0.04), 0, TAU); ctx.fill();
}
function drawHills() {
  const step = 10;
  for (const L of LAYERS) {
    const oy = -clamp((cam.y - bgY) * S * L.par * 0.8, -H * 0.12, H * 0.12);
    const col = mixC(pal[L.key], pal.skyHor, L.haze);
    ctx.beginPath(); ctx.moveTo(-step, H);
    for (let sx = -step; sx <= W + step; sx += step) ctx.lineTo(sx, layerY(L, sx / VIEW + cam.x * L.par, oy));
    ctx.lineTo(W + step, H); ctx.closePath();
    const top = H * (L.base - L.amp) + oy;
    const g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, rgba(mixC(col, WHITE, 0.25))); g.addColorStop(0.35, rgba(col)); g.addColorStop(1, rgba(mixC(col, pal.soil, 0.55)));
    ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 14; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.6; ctx.stroke();

    if (L.turbines) {
      const u0 = cam.x * L.par - 60, u1 = (W / VIEW) + cam.x * L.par + 60;
      for (let i = Math.floor(u0 * L.freq * 3); i <= Math.ceil(u1 * L.freq * 3); i++) {
        if (hash(i, 999) < 0.7) continue;
        const u = i / (L.freq * 3), sx = (u - cam.x * L.par) * VIEW;
        drawTurbine(sx, layerY(L, u, oy) + 3, H * 0.09 * (0.8 + hash(i, 5) * 0.4), i);
      }
    }
  }
}

/* ───────────────────────── render: world ───────────────────────── */
function drawGround(x0, x1, yBot) {
  const i0 = Math.max(0, Math.floor(x0 / DX) - T.base), i1 = Math.min(T.ys.length - 1, Math.ceil(x1 / DX) - T.base);
  const pieces = []; let cur = [];
  for (let i = i0; i <= i1; i++) {
    const x = (T.base + i) * DX;
    if (gapAt(x)) { if (cur.length) { pieces.push(cur); cur = []; } continue; }
    cur.push(x, T.ys[i]);
  }
  if (cur.length) pieces.push(cur);

  // lagoon water inside chasms
  for (const g of T.gaps) {
    if (g.x2 < x0 || g.x1 > x1) continue;
    const wy = Math.max(groundAt(g.x1), groundAt(g.x2)) + 140;
    const wg = ctx.createLinearGradient(0, wy, 0, wy + 300);
    wg.addColorStop(0, pal.c.sea); wg.addColorStop(1, pal.c.seaDeep);
    ctx.fillStyle = wg; ctx.fillRect(g.x1, wy, g.x2 - g.x1, yBot - wy);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(g.x1, wy, g.x2 - g.x1, 2.5);
    for (let k = 0; k < 4; k++) {
      const xx = g.x1 + ((k * 53 + time * 30) % (g.x2 - g.x1));
      ctx.fillRect(xx, wy + 10 + k * 9, 14, 1.5);
    }
  }

  const gD = rgba(mixC(pal.grass, pal.grassDeep, 0.5)), sD = rgba(mixC(pal.grassDeep, pal.soil, 0.5));
  const bands = [[0, pal.c.grassHi], [2.5, pal.c.grass], [12, gD], [22, pal.c.grassDeep], [42, sD], [72, pal.c.soil]];
  for (const [off, col] of bands) {
    ctx.fillStyle = col; ctx.beginPath();
    for (const p of pieces) {
      if (p.length < 4) continue;
      ctx.moveTo(p[0], yBot);
      for (let k = 0; k < p.length; k += 2) ctx.lineTo(p[k], p[k + 1] + off);
      ctx.lineTo(p[p.length - 2], yBot); ctx.closePath();
    }
    ctx.fill();
  }
  // glassy sheen just under the surface
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const p of pieces) for (let k = 0; k < p.length; k += 2) k ? ctx.lineTo(p[k], p[k + 1] + 6) : ctx.moveTo(p[k], p[k + 1] + 6);
  ctx.stroke();
}

function drawTrees(x0, x1) {
  for (const t of trees) {
    if (t.x < x0 - 150 || t.x > x1 + 150) continue;
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(mixC([110, 86, 66], pal.soil, 0.3 + pal.night * 0.4)); ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.quadraticCurveTo(t.x, t.y - t.h * 0.5, t.top[0], t.top[1]); ctx.stroke();
    const leaf = mixC(pal.grass, pal.h1, t.hue * 0.6), dark = mixC(pal.grassDeep, pal.soil, 0.2), lite = mixC(pal.grassHi, leaf, 0.35);
    for (const [bx, by, br] of t.blobs) {
      const cx = t.top[0] + bx, cy = t.top[1] + by;
      const g = ctx.createRadialGradient(cx - br * 0.4, cy - br * 0.5, br * 0.1, cx, cy, br);
      g.addColorStop(0, rgba(lite)); g.addColorStop(0.55, rgba(leaf)); g.addColorStop(1, rgba(dark));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, br, 0, TAU); ctx.fill();
    }
    const b0 = t.blobs[t.blobs.length - 1];
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(t.top[0] + b0[0] - b0[2] * 0.3, t.top[1] + b0[1] - b0[2] * 0.55, b0[2] * 0.4, b0[2] * 0.2, -0.4, 0, TAU); ctx.fill();
  }
}

function drawLift(x0, x1) {
  ctx.lineCap = 'round';
  for (const p of poles) {
    if (p.x < x0 - 50 || p.x > x1 + 50) continue;
    ctx.strokeStyle = '#9fb3c8'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(p.x, p.y + 8); ctx.lineTo(p.x, p.y - POLE_H); ctx.stroke();
    ctx.strokeStyle = '#eef6fc'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(p.x - 0.8, p.y + 8); ctx.lineTo(p.x - 0.8, p.y - POLE_H); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(p.x - 2, p.y); ctx.lineTo(p.x - 2, p.y - POLE_H + 2); ctx.stroke();
    gemWorld(p.x - 18, p.y - WIRE_H - 5, 36, 10, pal.accent);
  }
  for (const w of wires) {
    if (w.x2 < x0 || w.x1 > x1) continue;
    const mx = (w.x1 + w.x2) / 2, my = (w.y1 + w.y2) / 2 + w.sag * 2;
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.quadraticCurveTo(mx, my, w.x2, w.y2);
    ctx.lineWidth = 4.5; ctx.strokeStyle = '#2b3d52'; ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = pal.c.bubble; ctx.stroke();
  }
}
function gemWorld(x, y, w, h, col) {
  rr(x, y, w, h, h / 2);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, rgba(mixC(col, WHITE, 0.55))); g.addColorStop(0.5, rgba(col)); g.addColorStop(1, rgba(mixC(col, [0, 30, 80], 0.3)));
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; rr(x + 3, y + 1.2, w - 6, h * 0.35, h * 0.17); ctx.fill();
}

function drawRocks(x0, x1) {
  for (const r of rocks) {
    if (r.x < x0 - 80 || r.x > x1 + 80) continue;
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.a);
    // soft contact shadow
    ctx.fillStyle = 'rgba(0,40,30,0.25)'; ctx.beginPath(); ctx.ellipse(4, 4, r.w * 0.6, 6, 0, 0, TAU); ctx.fill();
    const p = r.pts;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my); }
    ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]); ctx.closePath();
    const g = ctx.createRadialGradient(-r.w * 0.2, -r.h * 0.75, 2, 0, -r.h * 0.3, r.w * 0.75);
    g.addColorStop(0, '#e6eef6'); g.addColorStop(0.35, '#8ea2b8'); g.addColorStop(1, '#2f3f55');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(-r.w * 0.16, -r.h * 0.72, r.w * 0.12, r.h * 0.07, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawOrb(x, y, rad, col, alpha = 1) {
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad);
  g.addColorStop(0, rgba(mixC(col, WHITE, 0.85), 0.9)); g.addColorStop(0.5, rgba(col, 0.45)); g.addColorStop(1, rgba(mixC(col, pal.accent, 0.5), 0.9));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = Math.max(1, rad * 0.1); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.ellipse(x - rad * 0.35, y - rad * 0.45, rad * 0.32, rad * 0.18, -0.6, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawCoins(x0, x1) {
  for (const c of coins) {
    if (c.taken || c.x < x0 - 30 || c.x > x1 + 30) continue;
    drawOrb(c.x, c.y + Math.sin(c.t * 3) * 3, 11 + Math.sin(c.t * 5) * 0.6, pal.bubble);
  }
}

/* glossy 3D figure: each limb is a capsule shaded edge → body → highlight → specular */
const FIG = { edge: [10, 82, 44], base: [38, 170, 92], light: [128, 240, 178], top: [214, 255, 233] };
function drawRider() {
  if (R.mode === 'dead') return;
  // contact shadow on the ground below
  if (!gapAt(R.x)) {
    const gy = groundAt(R.x), h = Math.max(0, gy - R.y);
    const a = clamp(0.35 - h / 900, 0, 0.35), sc = 1 + h / 400;
    if (a > 0.01) {
      ctx.save(); ctx.translate(R.x, gy + 1); ctx.rotate(Math.atan(slopeAt(R.x)));
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 30 * sc);
      g.addColorStop(0, `rgba(0,40,30,${a})`); g.addColorStop(1, 'rgba(0,40,30,0)');
      ctx.fillStyle = g; ctx.scale(1, 0.22); ctx.beginPath(); ctx.arc(0, 0, 30 * sc, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  const c = R.crouch, o = -5, k = 1.18;
  const P = {};
  const J = {
    bf: [-9, 0], ff: [9, 0], bk: [-7 + 2 * c, -12 + 5 * c], fk: [12 - c, -12 + 5 * c], hip: [1 - c, -23 + 9 * c],
    sh: [5 + 4 * c, -36 + 13 * c], head: [8 + 6 * c, -46 + 15 * c], bh: [-13 + 5 * c, -26 + 10 * c], fh: [19 - 2 * c, -29 + 13 * c],
  };
  for (const key in J) P[key] = [J[key][0] * k, J[key][1] * k + o];
  // world light from upper left, expressed in the rider's rotated frame
  const ca = Math.cos(R.ang), sa = Math.sin(R.ang), Lx = -0.5, Ly = -0.86;
  const lx = Lx * ca + Ly * sa, ly = -Lx * sa + Ly * ca;

  ctx.save(); ctx.translate(R.x, R.y); ctx.rotate(R.ang);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // glossy board
  const board = () => { ctx.beginPath(); ctx.moveTo(-29, -7); ctx.quadraticCurveTo(-27, -1.5, -20, -1.5); ctx.lineTo(20, -1.5); ctx.quadraticCurveTo(27, -1.5, 29, -7); };
  board(); ctx.lineWidth = 8; ctx.strokeStyle = rgba(mixC(pal.accent, [0, 30, 80], 0.45)); ctx.stroke();
  board(); ctx.lineWidth = 5.5; ctx.strokeStyle = pal.c.accent; ctx.stroke();
  ctx.save(); ctx.translate(lx * 1.6, ly * 1.6); board(); ctx.lineWidth = 1.8; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke(); ctx.restore();

  const capsule = (pts, w, dim) => {
    const pass = (col, width, off) => {
      ctx.strokeStyle = col; ctx.lineWidth = width;
      ctx.beginPath();
      pts.forEach(([x, y], i) => { const X = x + lx * w * off, Y = y + ly * w * off; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke();
    };
    const d = dim ? 0.18 : 0;
    pass(rgba(mixC(FIG.edge, [0, 0, 0], d)), w, 0);
    pass(rgba(mixC(FIG.base, FIG.edge, d)), w * 0.78, 0.07);
    pass(rgba(mixC(FIG.light, FIG.base, d)), w * 0.42, 0.2);
    pass(`rgba(255,255,255,${dim ? 0.55 : 0.85})`, w * 0.15, 0.28);
  };
  capsule([P.bf, P.bk, P.hip], 10, true);
  capsule([P.sh, P.bh], 8.5, true);
  capsule([P.hip, P.sh], 17, false);
  capsule([P.ff, P.fk, P.hip], 10, false);
  capsule([P.sh, P.fh], 8.5, false);
  // head sphere
  const [hx, hy] = P.head, hr = 9.5;
  const hg = ctx.createRadialGradient(hx + lx * 4, hy + ly * 4, 1, hx, hy, hr);
  hg.addColorStop(0, rgba(FIG.top)); hg.addColorStop(0.35, rgba(FIG.light)); hg.addColorStop(0.75, rgba(FIG.base)); hg.addColorStop(1, rgba(FIG.edge));
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.ellipse(hx + lx * 4.6, hy + ly * 4.6, 2.8, 1.8, Math.atan2(ly, lx) + Math.PI / 2, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.type === 'orb') {
      const x = p.x, y = p.y, rad = p.size;
      const g = ctx.createRadialGradient(x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad);
      g.addColorStop(0, rgba(FIG.top)); g.addColorStop(0.5, rgba(FIG.base)); g.addColorStop(1, rgba(FIG.edge));
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(x - rad * 0.35, y - rad * 0.4, rad * 0.25, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'bubble') {
      drawOrb(p.x, p.y, p.size, pal.bubble, a);
    } else if (p.type === 'star') {
      ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      const s = p.size * 1.6;
      ctx.beginPath(); ctx.moveTo(p.x - s, p.y); ctx.lineTo(p.x + s, p.y); ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x, p.y + s); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = pal.c[p.col] || '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

/* ───────────────────────── render: UI ───────────────────────── */
const FD = 'Nunito, "Segoe UI", "Arial Rounded MT Bold", sans-serif', FU = '"Open Sans", "Segoe UI", Frutiger, "Helvetica Neue", Arial, sans-serif';
const fd = (px, w = 900) => `${w} ${Math.round(px)}px ${FD}`, fu = (px, w = 700) => `${w} ${Math.round(px)}px ${FU}`;
const NAVY = '#0d3b66';
const fmt = n => n.toLocaleString('en-US');

function shadowText(text, x, y, fill, blur = 6) {
  ctx.save(); ctx.shadowColor = 'rgba(0,40,100,0.45)'; ctx.shadowBlur = blur; ctx.shadowOffsetY = 2;
  ctx.fillStyle = fill; ctx.fillText(text, x, y); ctx.restore();
}

function drawCallouts() {
  const big = clamp(H * 0.055, 22, 48);
  callouts.forEach((c, k) => {
    const y = H * 0.2 + k * big * 1.9;
    const pop = c.age < 0.22 ? 1 + Math.sin(c.age / 0.22 * Math.PI) * 0.18 : 1;
    const sc = Math.min(1, c.age / 0.1) * pop;
    const fade = clamp((c.life - c.age) / 0.25, 0, 1);
    ctx.font = fd(big);
    const tw = ctx.measureText(c.text).width, w = tw + big * 1.3, h = big * 1.35;
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(W / 2, y); ctx.scale(sc, sc);
    gem(-w / 2, -h / 2, w, h, pal.accent);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    shadowText(c.text, 0, big * 0.05, '#fff', 4);
    if (c.sub) { ctx.font = fu(big * 0.36); shadowText(c.sub, 0, h * 0.5 + big * 0.42, '#fff', 6); }
    ctx.restore();
  });
}

function drawHUD() {
  const m = 14, h = clamp(H * 0.075, 38, 52), fs = h * 0.4;
  if (state === 'title') {
    ctx.font = fu(Math.max(12, h * 0.3)); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const t = `Best ${fmt(best)}`, w = ctx.measureText(t).width + 28;
    glass(m, m, w, h * 0.75, h * 0.375, pal.skyMid);
    ctx.fillStyle = NAVY; ctx.fillText(t, m + 14, m + h * 0.375);
    return;
  }
  ctx.textBaseline = 'middle';
  // distance
  const dW = Math.max(130, fs * 7.2);
  glass(m, m, dW, h, h / 2, pal.skyMid);
  ctx.textAlign = 'left'; ctx.font = fu(fs * 0.55, 600); ctx.fillStyle = 'rgba(13,59,102,0.7)';
  ctx.fillText('DISTANCE', m + h * 0.45, m + h * 0.3);
  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY;
  ctx.fillText(`${fmt(Math.floor(distM))} m`, m + h * 0.45, m + h * 0.66);
  // score
  const sW = Math.max(150, fs * 8);
  glass(W - m - sW, m, sW, h, h / 2, pal.skyMid);
  ctx.textAlign = 'right'; ctx.font = fu(fs * 0.55, 600); ctx.fillStyle = 'rgba(13,59,102,0.7)';
  ctx.fillText('SCORE', W - m - h * 0.45, m + h * 0.3);
  ctx.font = fu(fs, 700); ctx.fillStyle = NAVY;
  ctx.fillText(fmt(score()), W - m - h * 0.45, m + h * 0.66);
  // combo badge
  if (combo > 1) {
    const cw = h * 1.9, cx = W - m - cw, cy = m + h + 10;
    gem(cx, cy, cw, h * 0.8, pal.accent);
    ctx.textAlign = 'center'; ctx.font = fd(fs * 1.05);
    shadowText(`×${combo}`, cx + cw / 2, cy + h * 0.4, '#fff', 3);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; rr(cx + 8, cy + h * 0.8 + 6, cw - 16, 5, 2.5); ctx.fill();
    ctx.fillStyle = pal.c.accent; rr(cx + 8, cy + h * 0.8 + 6, (cw - 16) * clamp(comboT / 3, 0, 1), 5, 2.5); ctx.fill();
  }
  if (W > 760) {
    ctx.textAlign = 'center'; ctx.font = fu(fs * 0.6, 600);
    const zt = `Zone ${pal.zone + 1}  ·  ${pal.name}`, zw = ctx.measureText(zt).width + 30;
    glass(W / 2 - zw / 2, m + h * 0.15, zw, h * 0.7, h * 0.35, pal.skyMid);
    ctx.fillStyle = NAVY; ctx.fillText(zt, W / 2, m + h * 0.5);
  }
}

function drawLogo(x, y, size, align) {
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = fd(size);
  const g = ctx.createLinearGradient(0, y - size * 0.8, 0, y);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.48, '#e4f6ff'); g.addColorStop(0.52, rgba(mixC(pal.accent, WHITE, 0.35))); g.addColorStop(1, pal.c.accent);
  ctx.save();
  ctx.shadowColor = 'rgba(0,50,120,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 5;
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.07; ctx.strokeStyle = '#ffffff'; ctx.strokeText('Aero', x, y);
  ctx.restore();
  ctx.fillStyle = g; ctx.fillText('Aero', x, y);
}

function drawTitle() {
  const u = UI;
  const size = Math.max(70, 170 * u), x = Math.max(24, W * 0.07), y = H * 0.4;
  drawLogo(x, y, size, 'left');
  ctx.font = fd(Math.max(18, 38 * u));
  const sub = 'DESCENT', sw = ctx.measureText(sub).width + Math.max(30, 54 * u), sh = Math.max(30, 56 * u);
  gem(x + size * 0.05, y + size * 0.2, sw, sh, pal.accent);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  shadowText(sub, x + size * 0.05 + (sw - ctx.measureText(sub).width) / 2, y + size * 0.2 + sh * 0.53, '#fff', 3);

  const fs = Math.max(12, 16 * u), px = x, py = y + size * 0.2 + sh + fs * 1.4;
  const lines = [['Tap / Space', 'Jump'], ['Hold in the air', 'Backflip'], ['Land with the slope', 'Keep riding']];
  const pw = Math.min(W - px * 2, fs * 22), ph = fs * 1.8 * lines.length + fs * 1.2;
  glass(px, py, pw, ph, fs * 0.9, pal.skyMid, true);
  ctx.font = fu(fs, 600);
  lines.forEach(([a, b], i) => {
    const yy = py + fs * 1.5 + i * fs * 1.8;
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.fillText(a, px + fs * 1.1, yy);
    ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.font = fu(fs, 700); ctx.fillText(b, px + pw - fs * 1.1, yy); ctx.font = fu(fs, 600);
  });
  const bs = 1 + Math.sin(time * 4) * 0.03;
  ctx.font = fu(fs * 1.1, 700);
  const bt = 'Press to start', bw = ctx.measureText(bt).width + fs * 3, bh = fs * 2.8;
  ctx.save(); ctx.translate(px + bw / 2, py + ph + bh * 0.9); ctx.scale(bs, bs);
  gem(-bw / 2, -bh / 2, bw, bh, [60, 200, 90]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; shadowText(bt, 0, 1, '#fff', 3);
  ctx.restore();
}

function drawDead() {
  if (deadT < 0.35) return;
  const a = clamp((deadT - 0.35) / 0.3, 0, 1), u = UI;
  ctx.fillStyle = `rgba(0,40,100,${0.25 * a})`; ctx.fillRect(0, 0, W, H);
  const fs = Math.max(13, 17 * u);
  const pw = Math.min(W - 32, Math.max(320, fs * 24)), ph = fs * 19;
  const px = (W - pw) / 2, py = Math.max(16, (H - ph) / 2);
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(0, (1 - a) * 30);
  glass(px, py, pw, ph, fs * 1.2, pal.skyMid, true);
  // title bar
  gem(px + fs, py + fs, pw - fs * 2, fs * 3.2, [255, 110, 90]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = fd(fs * 2);
  shadowText('Wipeout!', W / 2, py + fs * 2.65, '#fff', 3);
  ctx.font = fu(fs, 600); ctx.fillStyle = NAVY;
  ctx.fillText(deathReason, W / 2, py + fs * 5.6);
  const rows = [['Distance', `${fmt(Math.floor(distM))} m`], ['Score', fmt(score())], ['Backflips', String(runFlips)], ['Best', fmt(best) + (newBest ? '  New best!' : '')]];
  rows.forEach(([kk, v], i) => {
    const yy = py + fs * 7.8 + i * fs * 1.9;
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(px + fs * 1.2, yy - fs * 0.8, pw - fs * 2.4, fs * 1.6, fs * 0.8); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(13,59,102,0.7)'; ctx.font = fu(fs, 600); ctx.fillText(kk, px + fs * 2, yy);
    ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.font = fu(fs, 700); ctx.fillText(v, px + pw - fs * 2, yy);
  });
  if (deadT > 0.9) {
    const bt = 'Tap to try again', bh = fs * 2.6;
    ctx.font = fu(fs * 1.05, 700);
    const bw = ctx.measureText(bt).width + fs * 3;
    gem(W / 2 - bw / 2, py + ph - bh - fs * 1.1, bw, bh, [60, 200, 90]);
    ctx.textAlign = 'center'; shadowText(bt, W / 2, py + ph - bh / 2 - fs * 1.1 + 1, '#fff', 3);
  }
  ctx.restore();
}

function drawLensFlare() {
  const [sx, sy, r] = sunPos();
  const dx = W / 2 - sx, dy = H / 2 - sy;
  ctx.globalCompositeOperation = 'lighter';
  [[0.35, 0.5, pal.bubble, 0.12], [0.6, 0.25, pal.accent, 0.16], [0.95, 0.9, pal.bubble, 0.07], [1.25, 0.35, WHITE, 0.1], [1.5, 1.4, pal.accent, 0.05]].forEach(([t, rs, col, a]) => {
    const x = sx + dx * t, y = sy + dy * t, rad = r * rs * 1.6;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, rgba(col, a * 0.4)); g.addColorStop(0.8, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

function render() {
  setScreen();
  drawSky();
  drawClouds();
  drawSea();
  drawHills();

  setWorld();
  const x0 = cam.x - OX / S - 60, x1 = cam.x + (W - OX) / S + 60, yBot = cam.y + (H - OY) / S + 120;
  drawTrees(x0, x1);
  drawLift(x0, x1);
  drawGround(x0, x1, yBot);
  drawRocks(x0, x1);
  drawCoins(x0, x1);
  drawRider();
  drawParticles();

  setScreen();
  if (state === 'play' && (boostT > 0 || R.speed > 1000)) {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const y = hash(i, Math.floor(time * 20)) * H, x = hash(i + 50, Math.floor(time * 20)) * W, l = 60 + hash(i + 99, 1) * 160;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + l, y); ctx.stroke();
    }
  }
  for (const b of bubbles) drawOrb(b.x * W + Math.sin(b.w) * 6, b.y * H, b.r * Math.max(0.7, UI), pal.bubble, 0.35 + b.z * 0.3);
  drawLensFlare();
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (flashA > 0.01) { ctx.fillStyle = rgba(flashC, flashA); ctx.fillRect(0, 0, W, H); }

  if (state === 'play' && playT < 7) {
    ctx.font = fu(Math.max(12, 15 * UI), 700);
    const t = playT < 3.5 ? 'Tap to jump' : 'Hold in the air to backflip. Land flat!';
    const w = ctx.measureText(t).width + 32, h = Math.max(32, 40 * UI), y = H - h - 64;
    glass(W / 2 - w / 2, y, w, h, h / 2, pal.skyMid, true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = NAVY; ctx.fillText(t, W / 2, y + h / 2 + 1);
  }
  drawCallouts();
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'dead') drawDead();
  if (paused) {
    ctx.fillStyle = 'rgba(0,40,100,0.3)'; ctx.fillRect(0, 0, W, H);
    const fs = Math.max(14, 18 * UI), pw = fs * 16, ph = fs * 7;
    glass(W / 2 - pw / 2, H / 2 - ph / 2, pw, ph, fs, pal.skyMid, true);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fd(fs * 2.2); ctx.fillStyle = NAVY; ctx.fillText('Paused', W / 2, H / 2 - fs * 0.8);
    ctx.font = fu(fs, 600); ctx.fillText('Press to resume', W / 2, H / 2 + fs * 1.5);
  }
}

/* ───────────────────────── input ───────────────────────── */
function press() {
  initAudio();
  if (paused) { paused = false; return; }
  if (state === 'title') { startGame(); return; }
  if (state === 'dead') { if (deadT > 0.9) startGame(); return; }
  input.held = true; input.queued = true;
}
function release() { input.held = false; }

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', e => { e.stopPropagation(); initAudio(); setMute(!AU.on); muteBtn.blur(); });

window.addEventListener('pointerdown', e => { if (e.target === muteBtn) return; e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('blur', () => { release(); if (state === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyX', 'Enter'];
window.addEventListener('keydown', e => {
  if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') { initAudio(); setMute(!AU.on); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) release(); });

/* ───────────────────────── loop ───────────────────────── */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
function boot(data) {
  if (data && data.best) best = Math.max(best, data.best | 0);
  resize();
  resetWorld(true);
  requestAnimationFrame(t => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ best })); } catch (e) { }
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
